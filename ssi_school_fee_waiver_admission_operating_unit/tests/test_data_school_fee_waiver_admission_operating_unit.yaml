options:
  auto_refresh: true
scenarios:
  - name:
      "FW Admission OU - create derives operating_unit_id from the Admission's School,
      overriding the creating user's own default operating unit"
    steps:
      # ── Shared fixture chain (suffix ADMOU1) ─────────────────────
      - step: "Create partner for the creating user's own default operating unit"
        action: "create"
        model: "res.partner"
        save_as: "admou1_a_partner"
        values:
          name: "FW AdmOU1 A Partner"

      - step: "Create Operating Unit A (the creating user's own default)"
        action: "create"
        model: "operating.unit"
        save_as: "admou1_a"
        values:
          name: "FW AdmOU1 A"
          code: "ADMOU1A"
          company_id: "REF: base.main_company"
          partner_id: "REC: admou1_a_partner.id"

      - step: "Create partner for the Admission school's own operating unit"
        action: "create"
        model: "res.partner"
        save_as: "admou1_b_partner"
        values:
          name: "FW AdmOU1 B Partner"

      - step: "Create Operating Unit B (the Admission school's own)"
        action: "create"
        model: "operating.unit"
        save_as: "admou1_b"
        values:
          name: "FW AdmOU1 B"
          code: "ADMOU1B"
          company_id: "REF: base.main_company"
          partner_id: "REC: admou1_b_partner.id"

      - step: "Create the grade type"
        action: "create"
        model: "school_grade_type"
        save_as: "admou1_grade_type"
        values:
          name: "ADMOU1 Grade Type"
          code: "ADMOU1GT"

      - step: "Create the Admission's School with Operating Unit B"
        action: "create"
        model: "school"
        save_as: "admou1_school"
        values:
          name: "ADMOU1 School"
          code: "ADMOU1SCH"
          grade_type_id: "REC: admou1_grade_type.id"
          operating_unit_ids: [[6, 0, ["REC: admou1_b.id"]]]

      - step: "Create the grade"
        action: "create"
        model: "school_grade"
        save_as: "admou1_grade"
        values:
          name: "ADMOU1 Grade"
          code: "ADMOU1GR"
          type_id: "REC: admou1_grade_type.id"

      - step: "Create the academic year"
        action: "create"
        model: "school_academic_year"
        save_as: "admou1_academic_year"
        values:
          name: "ADMOU1 Academic Year"
          code: "ADMOU1AY"
          date_start: 2026-07-01
          date_end: 2027-06-30

      - step: "Create the academic term"
        action: "create"
        model: "school_academic_term"
        save_as: "admou1_academic_term"
        values:
          name: "ADMOU1 Term"
          code: "ADMOU1TM"
          date_start: 2026-07-01
          date_end: 2026-12-31
          year_id: "REC: admou1_academic_year.id"

      - step: "Create the admission student's contact"
        action: "create"
        model: "res.partner"
        save_as: "admou1_admission_contact"
        values:
          name: "ADMOU1 Admission Contact"

      - step: "Create the admission at the school"
        action: "create"
        model: "school_admission"
        save_as: "admou1_admission"
        values:
          academic_year_id: "REC: admou1_academic_year.id"
          academic_term_id: "REC: admou1_academic_term.id"
          school_id: "REC: admou1_school.id"
          grade_id: "REC: admou1_grade.id"
          student_id: "REC: admou1_admission_contact.id"
          user_id: "REF: base.user_admin"

      - step: "Confirm the admission as admin"
        action: "call"
        target: "admou1_admission"
        method: "action_confirm"
        as_user: "base.user_admin"
        # asserts + refresh: true force a fresh policy read before
        # Approve, so `approve_ok` is not read from the cache filled
        # while Confirm read `confirm_ok` with state still Draft
        # (odoo-development-unit-test, test-traps.md T-04).
        refresh: true
        asserts:
          state:
            type: "value"
            expected: "confirm"

      - step: "Approve the admission as admin (auto-opens)"
        action: "call"
        target: "admou1_admission"
        method: "action_approve_approval"
        as_user: "base.user_admin"
        asserts:
          state:
            type: "value"
            expected: "open"

      - step: "Create the fee waiver type"
        action: "create"
        model: "school_fee_waiver_type"
        save_as: "admou1_type"
        values:
          name: "ADMOU1 Type"
          code: "ADMOU1TY"

      - step: "Create the fee waiver reason"
        action: "create"
        model: "school_fee_waiver_reason"
        save_as: "admou1_reason"
        values:
          name: "ADMOU1 Reason"
          code: "ADMOU1RS"

      # The acting user's own default Operating Unit is set to A --
      # proving the assertion below is about derivation from the
      # Admission's school (B), not a coincidence of the acting
      # user's default. ``user`` is the built-in registry alias for
      # the acting env (root/OdooBot, uid=1 by default).
      - step: "Set the acting user's own default operating unit to A"
        action: "write"
        target: "user"
        values:
          default_operating_unit_id: "REC: admou1_a.id"
          assigned_operating_unit_ids: [[6, 0, ["REC: admou1_a.id"]]]

      - step: "Create the Admission-sourced fee waiver"
        action: "create"
        model: "school_fee_waiver"
        save_as: "admou1_waiver"
        values:
          type_id: "REC: admou1_type.id"
          reason_id: "REC: admou1_reason.id"
          student_id: "REC: admou1_admission.school_student_id.id"
          source_type: "admission"
          admission_id: "REC: admou1_admission.id"
          coverage: "multi_term"

      - step:
          "Assert operating unit was derived from the Admission's School (B), not the
          user's default (A)"
        action: "assert"
        target: "admou1_waiver"
        asserts:
          operating_unit_id:
            type: "m2o"
            expected: "REC: admou1_b"

