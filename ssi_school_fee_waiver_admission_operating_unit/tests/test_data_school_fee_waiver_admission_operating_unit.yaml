            expected: "REC: admou4_explicit_ou"

  - name:
      "FW Admission OU - negative, an Admission school with zero or more than one
      operating unit leaves operating_unit_id at the mixin's own default, without
      raising an error"
    steps:
      # ── Shared fixture chain (suffix ADMOU5) ─────────────────────
      - step: "Create partner for operating unit A (multi-OU school)"
        action: "create"
        model: "res.partner"
        save_as: "admou5_a_partner"
        values:
          name: "FW AdmOU5 A Partner"

      - step: "Create operating unit A"
        action: "create"
        model: "operating.unit"
        save_as: "admou5_a"
        values:
          name: "FW AdmOU5 A"
          code: "ADMOU5A"
          company_id: "REF: base.main_company"
          partner_id: "REC: admou5_a_partner.id"

      - step: "Create partner for operating unit B (multi-OU school)"
        action: "create"
        model: "res.partner"
        save_as: "admou5_b_partner"
        values:
          name: "FW AdmOU5 B Partner"

      - step: "Create operating unit B"
        action: "create"
        model: "operating.unit"
        save_as: "admou5_b"
        values:
          name: "FW AdmOU5 B"
          code: "ADMOU5B"
          company_id: "REF: base.main_company"
          partner_id: "REC: admou5_b_partner.id"

      - step: "Create the grade type"
        action: "create"
        model: "school_grade_type"
        save_as: "admou5_grade_type"
        values:
          name: "ADMOU5 Grade Type"
          code: "ADMOU5GT"

      - step: "Create the school with NO operating unit"
        action: "create"
        model: "school"
        save_as: "admou5_school_none"
        values:
          name: "ADMOU5 School None"
          code: "ADMOU5SCN"
          grade_type_id: "REC: admou5_grade_type.id"

      - step: "Create the school with TWO operating units"
        action: "create"
        model: "school"
        save_as: "admou5_school_multi"
        values:
          name: "ADMOU5 School Multi"
          code: "ADMOU5SCM"
          grade_type_id: "REC: admou5_grade_type.id"
          operating_unit_ids: [[6, 0, ["REC: admou5_a.id", "REC: admou5_b.id"]]]

      - step: "Create the grade"
        action: "create"
        model: "school_grade"
        save_as: "admou5_grade"
        values:
          name: "ADMOU5 Grade"
          code: "ADMOU5GR"
          type_id: "REC: admou5_grade_type.id"

      - step: "Create the academic year"
        action: "create"
        model: "school_academic_year"
        save_as: "admou5_academic_year"
        values:
          name: "ADMOU5 Academic Year"
          code: "ADMOU5AY"
          date_start: 2026-07-01
          date_end: 2027-06-30

      - step: "Create the academic term"
        action: "create"
        model: "school_academic_term"
        save_as: "admou5_academic_term"
        values:
          name: "ADMOU5 Term"
          code: "ADMOU5TM"
          date_start: 2026-07-01
          date_end: 2026-12-31
          year_id: "REC: admou5_academic_year.id"

      - step: "Create the OU-less admission's contact"
        action: "create"
        model: "res.partner"
        save_as: "admou5_contact_none"
        values:
          name: "ADMOU5 Admission Contact None"

      - step: "Create the admission at the OU-less school"
        action: "create"
        model: "school_admission"
        save_as: "admou5_admission_none"
        values:
          academic_year_id: "REC: admou5_academic_year.id"
          academic_term_id: "REC: admou5_academic_term.id"
          school_id: "REC: admou5_school_none.id"
          grade_id: "REC: admou5_grade.id"
          student_id: "REC: admou5_contact_none.id"
          user_id: "REF: base.user_admin"

      - step: "Confirm the OU-less admission as admin"
        action: "call"
        target: "admou5_admission_none"
        method: "action_confirm"
        as_user: "base.user_admin"
        refresh: true
        asserts:
          state:
            type: "value"
            expected: "confirm"

      - step: "Approve the OU-less admission as admin (auto-opens)"
        action: "call"
        target: "admou5_admission_none"
        method: "action_approve_approval"
        as_user: "base.user_admin"
        asserts:
          state:
            type: "value"
            expected: "open"

      - step: "Create the multi-OU admission's contact"
        action: "create"
        model: "res.partner"
        save_as: "admou5_contact_multi"
        values:
          name: "ADMOU5 Admission Contact Multi"

      - step: "Create the admission at the multi-OU school"
        action: "create"
        model: "school_admission"
        save_as: "admou5_admission_multi"
        values:
          academic_year_id: "REC: admou5_academic_year.id"
          academic_term_id: "REC: admou5_academic_term.id"
          school_id: "REC: admou5_school_multi.id"
          grade_id: "REC: admou5_grade.id"
          student_id: "REC: admou5_contact_multi.id"
          user_id: "REF: base.user_admin"

      - step: "Confirm the multi-OU admission as admin"
        action: "call"
        target: "admou5_admission_multi"
        method: "action_confirm"
        as_user: "base.user_admin"
        refresh: true
        asserts:
          state:
            type: "value"
            expected: "confirm"

      - step: "Approve the multi-OU admission as admin (auto-opens)"
        action: "call"
        target: "admou5_admission_multi"
        method: "action_approve_approval"
        as_user: "base.user_admin"
        asserts:
          state:
            type: "value"
            expected: "open"

      - step: "Create the fee waiver type"
        action: "create"
        model: "school_fee_waiver_type"
        save_as: "admou5_type"
        values:
          name: "ADMOU5 Type"
          code: "ADMOU5TY"

      - step: "Create the fee waiver reason"
        action: "create"
        model: "school_fee_waiver_reason"
        save_as: "admou5_reason"
        values:
          name: "ADMOU5 Reason"
          code: "ADMOU5RS"

      - step: "Create the fee waiver at the OU-less school's admission"
        action: "create"
        model: "school_fee_waiver"
        save_as: "admou5_waiver_none"
        values:
          type_id: "REC: admou5_type.id"
          reason_id: "REC: admou5_reason.id"
          student_id: "REC: admou5_admission_none.school_student_id.id"
          source_type: "admission"
          admission_id: "REC: admou5_admission_none.id"
          coverage: "multi_term"

      - step:
          "Assert operating_unit_id is left at the mixin's own default, no error, no
          derivation (zero operating units)"
        action: "assert"
        target: "admou5_waiver_none"
        asserts:
          operating_unit_id:
            type: "m2o"
            expected: "EVAL: env['res.users'].operating_unit_default_get()"

      - step: "Create the fee waiver at the multi-OU school's admission"
        action: "create"
        model: "school_fee_waiver"
        save_as: "admou5_waiver_multi"
        values:
          type_id: "REC: admou5_type.id"
          reason_id: "REC: admou5_reason.id"
          student_id: "REC: admou5_admission_multi.school_student_id.id"
          source_type: "admission"
          admission_id: "REC: admou5_admission_multi.id"
          coverage: "multi_term"

      - step:
          "Assert operating_unit_id is left at the mixin's own default, no error, no
          derivation (two operating units)"
        action: "assert"
        target: "admou5_waiver_multi"
        asserts:
          operating_unit_id:
            type: "m2o"
            expected: "EVAL: env['res.users'].operating_unit_default_get()"
