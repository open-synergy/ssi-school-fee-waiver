options:
  auto_refresh: true
scenarios:
  - name: "Fee Waiver Admission Header Amounts"
    steps:
      # ── Shared fixture chain (suffix HD1) ───────────────────────
      - step: "Create the grade type"
        action: "create"
        model: "school_grade_type"
        save_as: "grade_type1"
        values:
          name: "HD1 Grade Type"
          code: "HD1GT"

      - step: "Create the school"
        action: "create"
        model: "school"
        save_as: "school1"
        values:
          name: "HD1 School"
          code: "HD1SC"
          grade_type_id: "REC: grade_type1.id"

      - step: "Create the academic year"
        action: "create"
        model: "school_academic_year"
        save_as: "academic_year1"
        values:
          name: "HD1 Academic Year"
          code: "HD1AY"
          date_start: 2026-07-01
          date_end: 2027-06-30

      - step: "Create the academic term"
        action: "create"
        model: "school_academic_term"
        save_as: "academic_term1"
        values:
          name: "HD1 Term"
          code: "HD1TM"
          date_start: 2026-07-01
          date_end: 2026-12-31
          year_id: "REC: academic_year1.id"

      - step: "Create the grade"
        action: "create"
        model: "school_grade"
        save_as: "grade1"
        values:
          name: "HD1 Grade"
          code: "HD1GR"
          type_id: "REC: grade_type1.id"

      - step: "Create the admission student's contact"
        action: "create"
        model: "res.partner"
        save_as: "admission_contact1"
        values:
          name: "HD1 Admission Contact"

      - step: "Create the admission"
        action: "create"
        model: "school_admission"
        save_as: "admission1"
        values:
          academic_year_id: "REC: academic_year1.id"
          academic_term_id: "REC: academic_term1.id"
          school_id: "REC: school1.id"
          grade_id: "REC: grade1.id"
          student_id: "REC: admission_contact1.id"
          user_id: "REF: base.user_admin"

      - step: "Confirm the admission as admin"
        action: "call"
        target: "admission1"
        method: "action_confirm"
        as_user: "base.user_admin"
        asserts:
          state:
            type: "value"
            expected: "confirm"

      # The Confirm step above carries `asserts`, forcing the
      # library's _refresh() so `approve_ok` is not read from the
      # cache filled while action_confirm read confirm_ok with state
      # still Draft (odoo-development-unit-test, test-traps.md T-04).
      - step: "Approve the admission as admin (auto-opens)"
        action: "call"
        target: "admission1"
        method: "action_approve_approval"
        as_user: "base.user_admin"
        asserts:
          state:
            type: "value"
            expected: "open"

      - step: "Assert the admission created its School Student on Open"
        action: "assert"
        target: "admission1"
        asserts:
          school_student_id:
            type: "value"
            operator: "is_truthy"

      - step: "Get the account.account.type Income reference"
        action: "ref"
        xml_id: "account.data_account_type_revenue"
        save_as: "account_type_income"

      - step: "Create the income account used by payment term details"
        action: "create"
        model: "account.account"
        save_as: "income_account1"
        values:
          name: "HD1 Income Account"
          code: "HD1IA"
          user_type_id: "REC: account_type_income.id"
          reconcile: false

      - step: "Create the product covered by the waiver line"
        action: "create"
        model: "product.product"
        save_as: "product1"
        values:
          name: "HD1 Product"
          type: "service"

      - step: "Create Admission Payment Term 1"
        action: "create"
        model: "school_admission_payment_term"
        save_as: "term1"
        values:
          admission_id: "REC: admission1.id"
          name: "HD1 Term 1"
          date_due: 2026-08-15
          detail_ids:
            - - 0
              - 0
              - product_id: "REC: product1.id"
                name: "HD1 Term 1 Fee"
                account_id: "REC: income_account1.id"
                uom_quantity: 1.0
                uom_id: "REF: uom.product_uom_unit"
                price_unit: 1000000.0

      - step: "Create Admission Payment Term 2"
        action: "create"
        model: "school_admission_payment_term"
        save_as: "term2"
        values:
          admission_id: "REC: admission1.id"
          name: "HD1 Term 2"
          date_due: 2026-09-15
          detail_ids:
            - - 0
              - 0
              - product_id: "REC: product1.id"
                name: "HD1 Term 2 Fee"
                account_id: "REC: income_account1.id"
                uom_quantity: 1.0
                uom_id: "REF: uom.product_uom_unit"
                price_unit: 1000000.0

      - step: "Create Admission Payment Term 3"
        action: "create"
        model: "school_admission_payment_term"
        save_as: "term3"
        values:
          admission_id: "REC: admission1.id"
          name: "HD1 Term 3"
          date_due: 2026-10-15
          detail_ids:
            - - 0
              - 0
              - product_id: "REC: product1.id"
                name: "HD1 Term 3 Fee"
                account_id: "REC: income_account1.id"
                uom_quantity: 1.0
                uom_id: "REF: uom.product_uom_unit"
                price_unit: 1000000.0

      - step: "Create the fee waiver type"
        action: "create"
        model: "school_fee_waiver_type"
        save_as: "fw1_type"
        values:
          name: "HD1 Type"
          code: "HD1TY"

      - step: "Create the fee waiver reason"
        action: "create"
        model: "school_fee_waiver_reason"
        save_as: "fw1_reason"
        values:
          name: "HD1 Reason"
          code: "HD1RS"

      - step: "Create the Admission-sourced multi-term waiver (50%)"
        action: "create"
        model: "school_fee_waiver"
        save_as: "hd_waiver"
        values:
          type_id: "REC: fw1_type.id"
          reason_id: "REC: fw1_reason.id"
          student_id: "REC: admission1.school_student_id.id"
          source_type: "admission"
          admission_id: "REC: admission1.id"
          coverage: "multi_term"
          date_start: 2026-08-01
          date_end: 2026-10-31
          user_id: "REF: base.user_admin"
          line_ids:
            - - 0
              - 0
              - product_id: "REC: product1.id"
                computation: "percentage"
                percentage: 50.0

      - step: "Confirm the waiver"
        action: "call"
        target: "hd_waiver"
        method: "action_confirm"
        as_user: "base.user_admin"
        asserts:
          state:
            type: "value"
            expected: "confirm"

      - step: "Approve the waiver"
        action: "call"
        target: "hd_waiver"
        method: "action_approve_approval"
        as_user: "base.user_admin"
        asserts:
          state:
            type: "value"
            expected: "open"

      - step: "Find the Schedule line of Term 1"
        action: "search"
        model: "school_fee_waiver_schedule"
        domain: [["admission_payment_term_id", "=", "REC: term1.id"]]
        save_as: "sched1"
        limit: 1

      - step: "Find the Schedule line of Term 2"
        action: "search"
        model: "school_fee_waiver_schedule"
        domain: [["admission_payment_term_id", "=", "REC: term2.id"]]
        save_as: "sched2"
        limit: 1

      - step: "Find the Schedule line of Term 3"
        action: "search"
        model: "school_fee_waiver_schedule"
        domain: [["admission_payment_term_id", "=", "REC: term3.id"]]
        save_as: "sched3"
        limit: 1

      - step: "Open waiver: all planned is effective and not yet deducted"
        action: "assert"
        target: "admission1"
        asserts:
          amount_total:
            type: "value"
            expected: 3000000.0
          amount_fee_waiver:
            type: "value"
            expected: 1500000.0
          amount_fee_waiver_deducted:
            type: "value"
            expected: 0.0
          amount_fee_waiver_undeducted:
            type: "value"
            expected: 1500000.0
          amount_deduction:
            type: "value"
            expected: 1500000.0
          amount_deducted:
            type: "value"
            expected: 0.0
          amount_net:
            type: "value"
            expected: 1500000.0

      - step: "Partially deduct Payment Term 2"
        action: "write"
        target: "sched2"
        values:
          state: "realized"
          amount_realized: 250000.0

      - step: "Partial deduction: unrealized remainder is not a waiver"
        action: "assert"
        target: "admission1"
        asserts:
          amount_fee_waiver:
            type: "value"
            expected: 1250000.0
          amount_fee_waiver_deducted:
            type: "value"
            expected: 250000.0
          amount_fee_waiver_undeducted:
            type: "value"
            expected: 1000000.0
          amount_deduction:
            type: "value"
            expected: 1250000.0
          amount_deducted:
            type: "value"
            expected: 250000.0
          amount_net:
            type: "value"
            expected: 1750000.0

      - step: "Skip the Schedule line of Payment Term 3"
        action: "call"
        target: "sched3"
        method: "action_skip"
        as_user: "base.user_admin"
        asserts:
          state:
            type: "value"
            expected: "skipped"

      - step: "Skipped schedule is not counted in any field"
        action: "assert"
        target: "admission1"
        asserts:
          amount_fee_waiver:
            type: "value"
            expected: 750000.0
          amount_fee_waiver_deducted:
            type: "value"
            expected: 250000.0
          amount_fee_waiver_undeducted:
            type: "value"
            expected: 500000.0
          amount_deduction:
            type: "value"
            expected: 750000.0
          amount_deducted:
            type: "value"
            expected: 250000.0
          amount_net:
            type: "value"
            expected: 2250000.0
