options:
  auto_refresh: true
scenarios:
  - name: "Fee Waiver Admission Payment Term - Amount Summary"
    steps:
      # ── Shared fixture chain (suffix PT1) ───────────────────────
      - step: "Create the grade type"
        action: "create"
        model: "school_grade_type"
        save_as: "grade_type1"
        values:
          name: "PT1 Grade Type"
          code: "PT1GT"

      - step: "Create the school"
        action: "create"
        model: "school"
        save_as: "school1"
        values:
          name: "PT1 School"
          code: "PT1SC"
          grade_type_id: "REC: grade_type1.id"

      - step: "Create the academic year"
        action: "create"
        model: "school_academic_year"
        save_as: "academic_year1"
        values:
          name: "PT1 Academic Year"
          code: "PT1AY"
          date_start: 2026-07-01
          date_end: 2027-06-30

      - step: "Create the academic term"
        action: "create"
        model: "school_academic_term"
        save_as: "academic_term1"
        values:
          name: "PT1 Term"
          code: "PT1TM"
          date_start: 2026-07-01
          date_end: 2026-12-31
          year_id: "REC: academic_year1.id"

      - step: "Create the grade"
        action: "create"
        model: "school_grade"
        save_as: "grade1"
        values:
          name: "PT1 Grade"
          code: "PT1GR"
          type_id: "REC: grade_type1.id"

      - step: "Create the admission student's contact"
        action: "create"
        model: "res.partner"
        save_as: "admission_contact1"
        values:
          name: "PT1 Admission Contact"

      - step: "Create the admission"
        action: "create"
        model: "school_admission"
        save_as: "admission1"
        values:
          academic_year_id: "REC: academic_year1.id"
          academic_term_id: "REC: academic_term1.id"
          school_id: "REC: school1.id"
          grade_id: "REC: grade1.id"
          student_id: "REC: admission_contact1.id"
          user_id: "REF: base.user_admin"

      - step: "Confirm the admission as admin"
        action: "call"
        target: "admission1"
        method: "action_confirm"
        as_user: "base.user_admin"
        asserts:
          state:
            type: "value"
            expected: "confirm"

      # The Confirm step above carries `asserts`, forcing the
      # library's _refresh() so `approve_ok` is not read from the
      # cache filled while action_confirm read confirm_ok with state
      # still Draft (odoo-development-unit-test, test-traps.md T-04).
      - step: "Approve the admission as admin (auto-opens)"
        action: "call"
        target: "admission1"
        method: "action_approve_approval"
        as_user: "base.user_admin"
        asserts:
          state:
            type: "value"
            expected: "open"

      - step: "Assert the admission created its School Student on Open"
        action: "assert"
        target: "admission1"
        asserts:
          school_student_id:
            type: "value"
            operator: "is_truthy"

      - step: "Get the account.account.type Income reference"
        action: "ref"
        xml_id: "account.data_account_type_revenue"
        save_as: "account_type_income"

      - step: "Create the income account used by payment term details"
        action: "create"
        model: "account.account"
        save_as: "income_account1"
        values:
          name: "PT1 Income Account"
          code: "PT1IA"
          user_type_id: "REC: account_type_income.id"
          reconcile: false

      - step: "Create the product covered by the waiver line"
        action: "create"
        model: "product.product"
        save_as: "product1"
        values:
          name: "PT1 Product"
          type: "service"

      - step: "Create Admission Payment Term A"
        action: "create"
        model: "school_admission_payment_term"
        save_as: "term1a"
        values:
          admission_id: "REC: admission1.id"
          name: "PT1 Term A"
          date_due: 2026-08-15
          detail_ids:
            - - 0
              - 0
              - product_id: "REC: product1.id"
                name: "PT1 Term A Fee"
                account_id: "REC: income_account1.id"
                uom_quantity: 1.0
                uom_id: "REF: uom.product_uom_unit"
                price_unit: 1000000.0

      - step: "Create Admission Payment Term B"
        action: "create"
        model: "school_admission_payment_term"
        save_as: "term1b"
        values:
          admission_id: "REC: admission1.id"
          name: "PT1 Term B"
          date_due: 2026-09-15
          detail_ids:
            - - 0
              - 0
              - product_id: "REC: product1.id"
                name: "PT1 Term B Fee"
                account_id: "REC: income_account1.id"
                uom_quantity: 1.0
                uom_id: "REF: uom.product_uom_unit"
                price_unit: 1000000.0

      - step: "Create Admission Payment Term C"
        action: "create"
        model: "school_admission_payment_term"
        save_as: "term1c"
        values:
          admission_id: "REC: admission1.id"
          name: "PT1 Term C"
          date_due: 2026-10-15
          detail_ids:
            - - 0
              - 0
              - product_id: "REC: product1.id"
                name: "PT1 Term C Fee"
                account_id: "REC: income_account1.id"
                uom_quantity: 1.0
                uom_id: "REF: uom.product_uom_unit"
                price_unit: 1000000.0

      - step: "Create the fee waiver type"
        action: "create"
        model: "school_fee_waiver_type"
        save_as: "fw1_type"
        values:
          name: "PT1 Type"
          code: "PT1TY"

      - step: "Create the fee waiver reason"
        action: "create"
        model: "school_fee_waiver_reason"
        save_as: "fw1_reason"
        values:
          name: "PT1 Reason"
          code: "PT1RS"

      - step: "Create the Admission-sourced multi-term waiver (50%)"
        action: "create"
        model: "school_fee_waiver"
        save_as: "pt_waiver"
        values:
          type_id: "REC: fw1_type.id"
          reason_id: "REC: fw1_reason.id"
          student_id: "REC: admission1.school_student_id.id"
          source_type: "admission"
          admission_id: "REC: admission1.id"
          coverage: "multi_term"
          date_start: 2026-08-01
          date_end: 2026-10-31
          user_id: "REF: base.user_admin"
          line_ids:
            - - 0
              - 0
              - product_id: "REC: product1.id"
                computation: "percentage"
                percentage: 50.0

      - step: "Draft waiver does not count on the payment term"
        action: "assert"
        target: "term1a"
        asserts:
          fee_waiver_amount:
            type: "value"
            expected: 0.0

      - step: "Confirm the waiver"
        action: "call"
        target: "pt_waiver"
        method: "action_confirm"
        as_user: "base.user_admin"
        asserts:
          state:
            type: "value"
            expected: "confirm"

      - step: "Approve the waiver"
        action: "call"
        target: "pt_waiver"
        method: "action_approve_approval"
        as_user: "base.user_admin"
        asserts:
          state:
            type: "value"
            expected: "open"

      - step: "Find the Schedule line of Term A"
        action: "search"
        model: "school_fee_waiver_schedule"
        domain: [["admission_payment_term_id", "=", "REC: term1a.id"]]
        save_as: "pt_sched_a"
        limit: 1

      - step: "Find the Schedule line of Term B"
        action: "search"
        model: "school_fee_waiver_schedule"
        domain: [["admission_payment_term_id", "=", "REC: term1b.id"]]
        save_as: "pt_sched_b"
        limit: 1

      - step: "Find the Schedule line of Term C"
        action: "search"
        model: "school_fee_waiver_schedule"
        domain: [["admission_payment_term_id", "=", "REC: term1c.id"]]
        save_as: "pt_sched_c"
        limit: 1

      - step: "Term A lists exactly one Schedule line"
        action: "assert"
        target: "term1a"
        asserts:
          fee_waiver_schedule_ids:
            type: "o2m"
            check: "count"
            expected_count: 1

      - step: "Open waiver, nothing deducted: all planned amount is not yet deducted"
        action: "assert"
        target: "term1a"
        asserts:
          fee_waiver_amount:
            type: "value"
            expected: 500000.0
          fee_waiver_amount_deducted:
            type: "value"
            expected: 0.0
          fee_waiver_amount_deducted_planned:
            type: "value"
            expected: 0.0
          fee_waiver_amount_undeducted:
            type: "value"
            expected: 500000.0

      - step: "Simulate a full deduction on Term B"
        action: "write"
        target: "pt_sched_b"
        values:
          state: "realized"
          amount_realized: 500000.0

      - step: "Full deduction: deducted equals planned, nothing left, total unchanged"
        action: "assert"
        target: "term1b"
        asserts:
          fee_waiver_amount:
            type: "value"
            expected: 500000.0
          fee_waiver_amount_deducted:
            type: "value"
            expected: 500000.0
          fee_waiver_amount_deducted_planned:
            type: "value"
            expected: 500000.0
          fee_waiver_amount_undeducted:
            type: "value"
            expected: 0.0

      - step: "Simulate a partial deduction on Term C"
        action: "write"
        target: "pt_sched_c"
        values:
          state: "realized"
          amount_realized: 250000.0

      - step: "Partial deduction: actual is half, planned is full, nothing left"
        action: "assert"
        target: "term1c"
        asserts:
          fee_waiver_amount:
            type: "value"
            expected: 500000.0
          fee_waiver_amount_deducted:
            type: "value"
            expected: 250000.0
          fee_waiver_amount_deducted_planned:
            type: "value"
            expected: 500000.0
          fee_waiver_amount_undeducted:
            type: "value"
            expected: 0.0

      - step: "Skip the Schedule line of Term A"
        action: "call"
        target: "pt_sched_a"
        method: "action_skip"
        as_user: "base.user_admin"
        asserts:
          state:
            type: "value"
            expected: "skipped"

      - step: "Skipped schedule: all four amounts are zero"
        action: "assert"
        target: "term1a"
        asserts:
          fee_waiver_amount:
            type: "value"
            expected: 0.0
          fee_waiver_amount_deducted:
            type: "value"
            expected: 0.0
          fee_waiver_amount_deducted_planned:
            type: "value"
            expected: 0.0
          fee_waiver_amount_undeducted:
            type: "value"
            expected: 0.0

      - step: "Term B is unaffected by skipping Term A"
        action: "assert"
        target: "term1b"
        asserts:
          fee_waiver_amount:
            type: "value"
            expected: 500000.0
          fee_waiver_amount_deducted:
            type: "value"
            expected: 500000.0
