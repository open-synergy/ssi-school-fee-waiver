options:
  auto_refresh: true
scenarios:
  - name: "Fee Waiver Admission - waiver before Open, payment term and cancel guards"
    steps:
      # ── Shared fixture chain (suffix ADG) ────────────────────────
      - step: "Create the grade type"
        action: "create"
        model: "school_grade_type"
        save_as: "adg_grade_type"
        values:
          name: "ADG Grade Type"
          code: "ADGGT"

      - step: "Create the school"
        action: "create"
        model: "school"
        save_as: "adg_school"
        values:
          name: "ADG School"
          code: "ADGSC"
          grade_type_id: "REC: adg_grade_type.id"

      - step: "Create the academic year"
        action: "create"
        model: "school_academic_year"
        save_as: "adg_academic_year"
        values:
          name: "ADG Academic Year"
          code: "ADGAY"
          date_start: 2026-07-01
          date_end: 2027-06-30

      - step: "Create the academic term"
        action: "create"
        model: "school_academic_term"
        save_as: "adg_academic_term"
        values:
          name: "ADG Term"
          code: "ADGTM"
          date_start: 2026-07-01
          date_end: 2026-12-31
          year_id: "REC: adg_academic_year.id"

      - step: "Create the grade"
        action: "create"
        model: "school_grade"
        save_as: "adg_grade"
        values:
          name: "ADG Grade"
          code: "ADGGR"
          type_id: "REC: adg_grade_type.id"

      - step: "Get the account.account.type Income reference"
        action: "ref"
        xml_id: "account.data_account_type_revenue"
        save_as: "adg_account_type_income"

      - step: "Create the income account used by payment term details"
        action: "create"
        model: "account.account"
        save_as: "adg_income_account"
        values:
          name: "ADG Income Account"
          code: "ADGIA"
          user_type_id: "REC: adg_account_type_income.id"
          reconcile: false

      - step: "Create the product covered by the waiver line"
        action: "create"
        model: "product.product"
        save_as: "adg_product"
        values:
          name: "ADG Product"
          type: "service"

      - step: "Create the fee waiver type"
        action: "create"
        model: "school_fee_waiver_type"
        save_as: "adg_type"
        values:
          name: "ADG Type"
          code: "ADGTY"

      - step: "Create the fee waiver reason"
        action: "create"
        model: "school_fee_waiver_reason"
        save_as: "adg_reason"
        values:
          name: "ADG Reason"
          code: "ADGRS"

      - step: "Get the sale journal"
        action: "search"
        model: "account.journal"
        domain: [["type", "=", "sale"]]
        save_as: "adg_journal"
        limit: 1

      - step: "Get the receivable account type"
        action: "ref"
        xml_id: "account.data_account_type_receivable"
        save_as: "adg_receivable_type"

      - step: "Create the receivable account"
        action: "create"
        model: "account.account"
        save_as: "adg_receivable_account"
        values:
          name: "ADG Receivable Account"
          code: "ADGRA"
          user_type_id: "REC: adg_receivable_type.id"
          reconcile: true

      - step: "Create the customer invoice type"
        action: "create"
        model: "customer_invoice_type"
        save_as: "adg_ci_type"
        values:
          name: "ADG Customer Invoice Type"
          code: "ADGCIT"
          journal_id: "REC: adg_journal.id"
          receivable_account_id: "REC: adg_receivable_account.id"

      - step: "Create an empty admission payment template"
        action: "create"
        model: "school_admission_payment_template"
        save_as: "adg_template"
        values:
          name: "ADG Payment Template"
          code: "ADGPT"
          school_id: "REC: adg_school.id"
          grade_id: "REC: adg_grade.id"
          academic_term_id: "REC: adg_academic_term.id"
          receivable_journal_id: "REC: adg_journal.id"
          receivable_account_id: "REC: adg_receivable_account.id"
          customer_invoice_type_id: "REC: adg_ci_type.id"

      - step: "Create the cancellation reason"
        action: "create"
        model: "base.cancel_reason"
        save_as: "adg_cancel_reason"
        values:
          name: "ADG Cancel Reason"
          code: "ADGCR"

      # ── Admission A: waiver approved before the admission is Open

      - step: "Create the contact of admission adg_adm_a"
        action: "create"
        model: "res.partner"
        save_as: "adg_contact_a"
        values:
          name: "ADG Contact adg_adm_a"

      - step: "Create admission adg_adm_a left in Draft"
        action: "create"
        model: "school_admission"
        save_as: "adg_adm_a"
        values:
          academic_year_id: "REC: adg_academic_year.id"
          academic_term_id: "REC: adg_academic_term.id"
          school_id: "REC: adg_school.id"
          grade_id: "REC: adg_grade.id"
          student_id: "REC: adg_contact_a.id"
          user_id: "REF: base.user_admin"

      - step: "Create the Student Profile of adg_adm_a while it is Draft"
        action: "call"
        target: "adg_adm_a"
        method: "action_create_school_student"
        as_user: "base.user_admin"
        asserts:
          state:
            type: "value"
            expected: "draft"
          school_student_id:
            type: "value"
            operator: "is_truthy"

      - step: "Create Admission Payment Term Term A1"
        action: "create"
        model: "school_admission_payment_term"
        save_as: "adg_term_a1"
        values:
          admission_id: "REC: adg_adm_a.id"
          name: "ADG Term A1"
          date_due: 2026-08-15
          detail_ids:
            - - 0
              - 0
              - product_id: "REC: adg_product.id"
                name: "ADG Term A1 Fee"
                account_id: "REC: adg_income_account.id"
                uom_quantity: 1.0
                uom_id: "REF: uom.product_uom_unit"
                price_unit: 1000000.0

      - step: "Create Admission Payment Term Term A2"
        action: "create"
        model: "school_admission_payment_term"
        save_as: "adg_term_a2"
        values:
          admission_id: "REC: adg_adm_a.id"
          name: "ADG Term A2"
          date_due: 2026-09-15
          detail_ids:
            - - 0
              - 0
              - product_id: "REC: adg_product.id"
                name: "ADG Term A2 Fee"
                account_id: "REC: adg_income_account.id"
                uom_quantity: 1.0
                uom_id: "REF: uom.product_uom_unit"
                price_unit: 1000000.0

      - step: "Create fee waiver adg_waiver_a"
        action: "create"
        model: "school_fee_waiver"
        save_as: "adg_waiver_a"
        values:
          type_id: "REC: adg_type.id"
          reason_id: "REC: adg_reason.id"
          student_id: "REC: adg_adm_a.school_student_id.id"
          source_type: "admission"
          admission_id: "REC: adg_adm_a.id"
          coverage: "multi_term"
          date_start: 2026-08-01
          date_end: 2026-09-30
          user_id: "REF: base.user_admin"
          line_ids:
            - - 0
              - 0
              - product_id: "REC: adg_product.id"
                computation: "percentage"
                percentage: 50.0

      - step: "Confirm adg_waiver_a"
        action: "call"
        target: "adg_waiver_a"
        method: "action_confirm"
        as_user: "base.user_admin"
        asserts:
          state:
            type: "value"
            expected: "confirm"
      # Refresh point required before Approve -- test-traps.md T-04.
      - step: "Approve adg_waiver_a"
        action: "call"
        target: "adg_waiver_a"
        method: "action_approve_approval"
        as_user: "base.user_admin"
        asserts:
          state:
            type: "value"
            expected: "open"

      - step: "Assert the waiver generated a Schedule line per term"
        action: "assert"
        target: "adg_waiver_a"
        asserts:
          schedule_ids:
            type: "o2m"
            check: "count"
            expected_count: 2

      - step: "Find the Schedule line realizing Term A1"
        action: "search"
        model: "school_fee_waiver_schedule"
        domain:
          - ["waiver_id", "=", "REC: adg_waiver_a.id"]
          - ["admission_payment_term_id", "=", "REC: adg_term_a1.id"]
        save_as: "adg_sched_a1"
        limit: 1

      - step: "Assert the Schedule line used the admission payment term"
        action: "assert"
        target: "adg_sched_a1"
        asserts:
          admission_payment_term_id:
            type: "m2o"
            expected: "REC: adg_term_a1"
          amount_planned:
            type: "value"
            expected: 500000.0

      - step: "Confirm admission A after its waiver is Open"
        action: "call"
        target: "adg_adm_a"
        method: "action_confirm"
        as_user: "base.user_admin"
        asserts:
          state:
            type: "value"
            expected: "confirm"

      # Refresh point required before Approve -- test-traps.md T-04.
      - step: "Approve admission A (auto-opens)"
        action: "call"
        target: "adg_adm_a"
        method: "action_approve_approval"
        as_user: "base.user_admin"
        asserts:
          state:
            type: "value"
            expected: "open"
          school_student_id:
            type: "m2o"
            expected: "REC: adg_waiver_a.student_id"

      # ── Admission B: guards while a waiver refers to the admission

      - step: "Create the contact of admission adg_adm_b"
        action: "create"
        model: "res.partner"
        save_as: "adg_contact_b"
        values:
          name: "ADG Contact adg_adm_b"

      - step: "Create admission adg_adm_b left in Draft"
        action: "create"
        model: "school_admission"
        save_as: "adg_adm_b"
        values:
          academic_year_id: "REC: adg_academic_year.id"
          academic_term_id: "REC: adg_academic_term.id"
          school_id: "REC: adg_school.id"
          grade_id: "REC: adg_grade.id"
          student_id: "REC: adg_contact_b.id"
          user_id: "REF: base.user_admin"
          payment_template_id: "REC: adg_template.id"

      - step: "Create the Student Profile of adg_adm_b while it is Draft"
        action: "call"
        target: "adg_adm_b"
        method: "action_create_school_student"
        as_user: "base.user_admin"
        asserts:
          state:
            type: "value"
            expected: "draft"
          school_student_id:
            type: "value"
            operator: "is_truthy"

      - step: "Create Admission Payment Term Term B1"
        action: "create"
        model: "school_admission_payment_term"
        save_as: "adg_term_b1"
        values:
          admission_id: "REC: adg_adm_b.id"
          name: "ADG Term B1"
          date_due: 2026-08-15
          detail_ids:
            - - 0
              - 0
              - product_id: "REC: adg_product.id"
                name: "ADG Term B1 Fee"
                account_id: "REC: adg_income_account.id"
                uom_quantity: 1.0
                uom_id: "REF: uom.product_uom_unit"
                price_unit: 1000000.0

      - step: "Create Admission Payment Term Term B2"
        action: "create"
        model: "school_admission_payment_term"
        save_as: "adg_term_b2"
        values:
          admission_id: "REC: adg_adm_b.id"
          name: "ADG Term B2"
          date_due: 2026-09-15
          detail_ids:
            - - 0
              - 0
              - product_id: "REC: adg_product.id"
                name: "ADG Term B2 Fee"
                account_id: "REC: adg_income_account.id"
                uom_quantity: 1.0
                uom_id: "REF: uom.product_uom_unit"
                price_unit: 1000000.0

      - step: "Create fee waiver adg_waiver_b_single"
        action: "create"
        model: "school_fee_waiver"
        save_as: "adg_waiver_b_single"
        values:
          type_id: "REC: adg_type.id"
          reason_id: "REC: adg_reason.id"
          student_id: "REC: adg_adm_b.school_student_id.id"
          source_type: "admission"
          admission_id: "REC: adg_adm_b.id"
          coverage: "single_term"
          admission_payment_term_id: "REC: adg_term_b1.id"
          user_id: "REF: base.user_admin"
          line_ids:
            - - 0
              - 0
              - product_id: "REC: adg_product.id"
                computation: "full"

      - step: "Create fee waiver adg_waiver_b_multi"
        action: "create"
        model: "school_fee_waiver"
        save_as: "adg_waiver_b_multi"
        values:
          type_id: "REC: adg_type.id"
          reason_id: "REC: adg_reason.id"
          student_id: "REC: adg_adm_b.school_student_id.id"
          source_type: "admission"
          admission_id: "REC: adg_adm_b.id"
          coverage: "multi_term"
          date_start: 2026-09-01
          date_end: 2026-09-30
          user_id: "REF: base.user_admin"
          line_ids:
            - - 0
              - 0
              - product_id: "REC: adg_product.id"
                computation: "full"

      - step: "Confirm adg_waiver_b_multi"
        action: "call"
        target: "adg_waiver_b_multi"
        method: "action_confirm"
        as_user: "base.user_admin"
        asserts:
          state:
            type: "value"
            expected: "confirm"
      # Refresh point required before Approve -- test-traps.md T-04.
      - step: "Approve adg_waiver_b_multi"
        action: "call"
        target: "adg_waiver_b_multi"
        method: "action_approve_approval"
        as_user: "base.user_admin"
        asserts:
          state:
            type: "value"
            expected: "open"

      - step: "Compute Payment is rejected while a waiver refers to the terms"
        action: "call"
        target: "adg_adm_b"
        method: "action_compute_payment"
        as_user: "base.user_admin"
        expect_error:
          type: "UserError"
          message_contains: "is referenced by fee waiver"

      - step: "Cancel adg_adm_b through the cancel reason wizard"
        action: "wizard"
        model: "base.select_cancel_reason"
        target: "adg_adm_b"
        as_user: "base.user_admin"
        values:
          cancel_reason_id: "REC: adg_cancel_reason.id"
        method: "action_confirm"
        expect_error:
          type: "UserError"
          message_contains: "has an active fee waiver"

      - step: "Confirm the single-term waiver so it can be cancelled"
        action: "call"
        target: "adg_waiver_b_single"
        method: "action_confirm"
        as_user: "base.user_admin"
        asserts:
          state:
            type: "value"
            expected: "confirm"

      - step: "Cancel adg_waiver_b_single through the cancel reason wizard"
        action: "wizard"
        model: "base.select_cancel_reason"
        target: "adg_waiver_b_single"
        as_user: "base.user_admin"
        values:
          cancel_reason_id: "REC: adg_cancel_reason.id"
        method: "action_confirm"
        asserts:
          state:
            type: "value"
            expected: "cancel"

      - step: "Cancel adg_adm_b through the cancel reason wizard"
        action: "wizard"
        model: "base.select_cancel_reason"
        target: "adg_adm_b"
        as_user: "base.user_admin"
        values:
          cancel_reason_id: "REC: adg_cancel_reason.id"
        method: "action_confirm"
        expect_error:
          type: "UserError"
          message_contains: "has an active fee waiver"

      - step: "Cancel adg_waiver_b_multi through the cancel reason wizard"
        action: "wizard"
        model: "base.select_cancel_reason"
        target: "adg_waiver_b_multi"
        as_user: "base.user_admin"
        values:
          cancel_reason_id: "REC: adg_cancel_reason.id"
        method: "action_confirm"
        asserts:
          state:
            type: "value"
            expected: "cancel"

      - step: "Cancel adg_adm_b through the cancel reason wizard"
        action: "wizard"
        model: "base.select_cancel_reason"
        target: "adg_adm_b"
        as_user: "base.user_admin"
        values:
          cancel_reason_id: "REC: adg_cancel_reason.id"
        method: "action_confirm"
        asserts:
          state:
            type: "value"
            expected: "cancel"
