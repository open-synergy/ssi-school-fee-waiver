          grade_type_id: "REC: grade_type4.id"

      - step: "Create the academic year"
        action: "create"
        model: "school_academic_year"
        save_as: "academic_year4"
        values:
          name: "ADM4 Academic Year"
          code: "ADM4AY"
          date_start: 2026-07-01
          date_end: 2027-06-30

      - step: "Create the academic term"
        action: "create"
        model: "school_academic_term"
        save_as: "academic_term4"
        values:
          name: "ADM4 Term"
          code: "ADM4TM"
          date_start: 2026-07-01
          date_end: 2026-12-31
          year_id: "REC: academic_year4.id"

      - step: "Create the grade"
        action: "create"
        model: "school_grade"
        save_as: "grade4"
        values:
          name: "ADM4 Grade"
          code: "ADM4GR"
          type_id: "REC: grade_type4.id"

      - step: "Create the fee waiver type"
        action: "create"
        model: "school_fee_waiver_type"
        save_as: "fw4_type"
        values:
          name: "ADM4 Type"
          code: "ADM4TY"

      - step: "Create the fee waiver reason"
        action: "create"
        model: "school_fee_waiver_reason"
        save_as: "fw4_reason"
        values:
          name: "ADM4 Reason"
          code: "ADM4RS"

      - step: "Create a bare contact for the waiver's own Student"
        action: "create"
        model: "res.partner"
        save_as: "bare_contact4"
        values:
          name: "ADM4 Bare Contact"

      - step: "Create the waiver's own (unrelated) Student"
        action: "create"
        model: "school_student"
        save_as: "bare_student4"
        values:
          name: "ADM4 Bare Student"
          code: "ADM4BST"
          contact_id: "REC: bare_contact4.id"
          school_id: "REC: school4.id"

      # ── Negative: Billing Source Admission with no Admission ─────
      - step: "Reject an Admission-sourced waiver with no Admission"
        action: "create"
        model: "school_fee_waiver"
        expect_error:
          type: "ValidationError"
          message_contains: "No billing source record set"
        values:
          type_id: "REC: fw4_type.id"
          reason_id: "REC: fw4_reason.id"
          student_id: "REC: bare_student4.id"
          source_type: "admission"
          coverage: "multi_term"

      # ── Negative: Admission not yet linked to student data (Draft)
      - step: "Create the admission student's contact (Admission C)"
        action: "create"
        model: "res.partner"
        save_as: "admission_contact4c"
        values:
          name: "ADM4 Admission Contact C"

      - step: "Create an admission left in Draft"
        action: "create"
        model: "school_admission"
        save_as: "admission4c"
        values:
          academic_year_id: "REC: academic_year4.id"
          academic_term_id: "REC: academic_term4.id"
          school_id: "REC: school4.id"
          grade_id: "REC: grade4.id"
          student_id: "REC: admission_contact4c.id"

      - step: "Reject a waiver billed against a still-Draft Admission"
        action: "create"
        model: "school_fee_waiver"
        expect_error:
          type: "ValidationError"
          message_contains: "is not yet linked to student data"
        values:
          type_id: "REC: fw4_type.id"
          reason_id: "REC: fw4_reason.id"
          student_id: "REC: bare_student4.id"
          source_type: "admission"
          admission_id: "REC: admission4c.id"
          coverage: "multi_term"

      # ── Negative: Admission's School Student differs from Student ─
      - step: "Create the admission student's contact (Admission B)"
        action: "create"
        model: "res.partner"
        save_as: "admission_contact4b"
        values:
          name: "ADM4 Admission Contact B"

      - step: "Create Admission B, opened"
        action: "create"
        model: "school_admission"
        save_as: "admission4b"
        values:
          academic_year_id: "REC: academic_year4.id"
          academic_term_id: "REC: academic_term4.id"
          school_id: "REC: school4.id"
          grade_id: "REC: grade4.id"
          student_id: "REC: admission_contact4b.id"
          user_id: "REF: base.user_admin"

      - step: "Confirm Admission B as admin"
        action: "call"
        target: "admission4b"
        method: "action_confirm"
        as_user: "base.user_admin"
        asserts:
          state:
            type: "value"
            expected: "confirm"

      - step: "Approve Admission B as admin (auto-opens)"
        action: "call"
        target: "admission4b"
        method: "action_approve_approval"
        as_user: "base.user_admin"
        asserts:
          state:
            type: "value"
            expected: "open"

      - step: "Reject a waiver mixing an unrelated Student with Admission B"
        action: "create"
        model: "school_fee_waiver"
        expect_error:
          type: "ValidationError"
          message_contains: "does not belong to Student"
        values:
          type_id: "REC: fw4_type.id"
          reason_id: "REC: fw4_reason.id"
          student_id: "REC: bare_student4.id"
          source_type: "admission"
          admission_id: "REC: admission4b.id"
          coverage: "multi_term"

      # ── Negative: schedule with both source terms set ─────────────
      - step: "Create a product for the fixture line"
        action: "create"
        model: "product.product"
        save_as: "product4"
        values:
          name: "ADM4 Product"
          type: "service"

      - step: "Create a valid Admission-sourced waiver as line_id fixture"
        action: "create"
        model: "school_fee_waiver"
        save_as: "waiver4x"
        values:
          type_id: "REC: fw4_type.id"
          reason_id: "REC: fw4_reason.id"
          student_id: "REC: admission4b.school_student_id.id"
          source_type: "admission"
          admission_id: "REC: admission4b.id"
          coverage: "multi_term"
          user_id: "REF: base.user_admin"

      - step: "Create the fixture Line"
        action: "create"
        model: "school_fee_waiver_line"
        save_as: "line4x"
        values:
          waiver_id: "REC: waiver4x.id"
          product_id: "REC: product4.id"
          computation: "full"

      - step: "Create a bare Enrollment Payment Term (no Enrollment)"
        action: "create"
        model: "school_enrollment_payment_term"
        save_as: "payment_term4d"
        values:
          name: "ADM4 Bare Enrollment Term"

      - step: "Create an Admission Payment Term on Admission B"
        action: "create"
        model: "school_admission_payment_term"
        save_as: "admission_payment_term4b"
        values:
          admission_id: "REC: admission4b.id"
          name: "ADM4 Admission Term B"

      - step: "Reject a Schedule line setting both source term fields"
        action: "create"
        model: "school_fee_waiver_schedule"
        expect_error:
          type: "ValidationError"
          message_contains: "Exactly one of Payment Term or Admission Payment Term"
        values:
          line_id: "REC: line4x.id"
          date: 2026-08-01
          payment_term_id: "REC: payment_term4d.id"
          admission_payment_term_id: "REC: admission_payment_term4b.id"
