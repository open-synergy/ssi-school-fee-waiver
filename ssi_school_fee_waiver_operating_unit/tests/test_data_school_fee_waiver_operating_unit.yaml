options:
  auto_refresh: true
scenarios:
  - name:
      "FW OU Derive - create derives operating unit from enrollment's school, overriding
      the creating user's own default operating unit"
    steps:
      # ── Shared fixture chain (suffix FWOU1) ──────────────────────
      - step: "Create partner for Operating Unit A"
        action: "create"
        model: "res.partner"
        save_as: "fwou1_a_partner"
        values:
          name: "FW Derive OU1 A Partner"

      - step: "Create Operating Unit A (the creating user's own default)"
        action: "create"
        model: "operating.unit"
        save_as: "fwou1_a"
        values:
          name: "FW Derive OU1 A"
          code: "FWOU1A"
          company_id: "REF: base.main_company"
          partner_id: "REC: fwou1_a_partner.id"

      - step: "Create partner for Operating Unit B"
        action: "create"
        model: "res.partner"
        save_as: "fwou1_b_partner"
        values:
          name: "FW Derive OU1 B Partner"

      - step: "Create Operating Unit B (the enrollment school's own)"
        action: "create"
        model: "operating.unit"
        save_as: "fwou1_b"
        values:
          name: "FW Derive OU1 B"
          code: "FWOU1B"
          company_id: "REF: base.main_company"
          partner_id: "REC: fwou1_b_partner.id"

      - step: "Create grade type"
        action: "create"
        model: "school_grade_type"
        save_as: "fwou1_grade_type"
        values:
          name: "FWOU1 Grade Type"
          code: "FWOU1GT"

      - step: "Create School A with Operating Unit A"
        action: "create"
        model: "school"
        save_as: "fwou1_school_a"
        values:
          name: "FWOU1 School A"
          code: "FWOU1SCA"
          grade_type_id: "REC: fwou1_grade_type.id"
          operating_unit_ids: [[6, 0, ["REC: fwou1_a.id"]]]

      - step: "Create School B with Operating Unit B"
        action: "create"
        model: "school"
        save_as: "fwou1_school_b"
        values:
          name: "FWOU1 School B"
          code: "FWOU1SCB"
          grade_type_id: "REC: fwou1_grade_type.id"
          operating_unit_ids: [[6, 0, ["REC: fwou1_b.id"]]]

      - step: "Create grade"
        action: "create"
        model: "school_grade"
        save_as: "fwou1_grade"
        values:
          name: "FWOU1 Grade"
          code: "FWOU1GR"
          type_id: "REC: fwou1_grade_type.id"

      - step: "Create grade class at School B"
        action: "create"
        model: "school_grade_class"
        save_as: "fwou1_grade_class_b"
        values:
          name: "FWOU1 Class B"
          code: "FWOU1CLB"
          school_id: "REC: fwou1_school_b.id"
          grade_id: "REC: fwou1_grade.id"

      - step: "Create academic year"
        action: "create"
        model: "school_academic_year"
        save_as: "fwou1_academic_year"
        values:
          name: "FWOU1 Academic Year"
          code: "FWOU1AY"
          date_start: 2026-07-01
          date_end: 2027-06-30

      - step: "Create academic term"
        action: "create"
        model: "school_academic_term"
        save_as: "fwou1_academic_term"
        values:
          name: "FWOU1 Term"
          code: "FWOU1TM"
          date_start: 2026-07-01
          date_end: 2026-12-31
          year_id: "REC: fwou1_academic_year.id"

      - step: "Create student contact"
        action: "create"
        model: "res.partner"
        save_as: "fwou1_contact"
        values:
          name: "FWOU1 Contact"

      - step: "Create student at School B"
        action: "create"
        model: "school_student"
        save_as: "fwou1_student"
        values:
          name: "FWOU1 Student"
          code: "FWOU1ST"
          contact_id: "REC: fwou1_contact.id"
          school_id: "REC: fwou1_school_b.id"

      - step: "Create enrollment at School B"
        action: "create"
        model: "school_enrollment"
        save_as: "fwou1_enrollment"
        values:
          academic_year_id: "REC: fwou1_academic_year.id"
          academic_term_id: "REC: fwou1_academic_term.id"
          school_id: "REC: fwou1_school_b.id"
          grade_id: "REC: fwou1_grade.id"
          grade_class_id: "REC: fwou1_grade_class_b.id"
          student_id: "REC: fwou1_student.id"

      - step: "Create the fee waiver type"
        action: "create"
        model: "school_fee_waiver_type"
        save_as: "fwou1_type"
        values:
          name: "FWOU1 Type"
          code: "FWOU1TY"

      - step: "Create the fee waiver reason"
        action: "create"
        model: "school_fee_waiver_reason"
        save_as: "fwou1_reason"
        values:
          name: "FWOU1 Reason"
          code: "FWOU1RS"

      # The acting user's own default Operating Unit is set to A --
      # proving the assertion below is about derivation from the
      # enrollment's school (B), not a coincidence of the acting
      # user's default. ``user`` is the built-in registry alias for
      # the acting env (root/OdooBot, uid=1 by default), so this
      # simulates "the creating user's own default OU is A" without
      # needing a dedicated, OU-restricted res.users record -- which
      # would itself be denied read access to School B by the global
      # ``school - operating unit`` record rule
      # (ssi_school_operating_unit) before derivation ever runs.
      - step: "Set the acting user's own default operating unit to A"
        action: "write"
        target: "user"
        values:
          default_operating_unit_id: "REC: fwou1_a.id"
          assigned_operating_unit_ids: [[6, 0, ["REC: fwou1_a.id"]]]

      - step: "Create the fee waiver at School B's enrollment"
        action: "create"
        model: "school_fee_waiver"
        save_as: "fwou1_waiver"
        values:
          type_id: "REC: fwou1_type.id"
          reason_id: "REC: fwou1_reason.id"
          student_id: "REC: fwou1_student.id"
          enrollment_id: "REC: fwou1_enrollment.id"
          coverage: "multi_term"

      - step: "Assert operating unit followed School B, not the user's default (A)"
        action: "assert"
        target: "fwou1_waiver"
        asserts:
          operating_unit_id:
            type: "m2o"
            expected: "REC: fwou1_b"

