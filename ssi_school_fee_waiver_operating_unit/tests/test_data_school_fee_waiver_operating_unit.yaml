        values:
          academic_year_id: "REC: fwou5_academic_year.id"
          academic_term_id: "REC: fwou5_academic_term.id"
          school_id: "REC: fwou5_school_b.id"
          grade_id: "REC: fwou5_grade.id"
          grade_class_id: "REC: fwou5_grade_class_b.id"
          student_id: "REC: fwou5_student_b.id"

      - step: "Create the fee waiver type"
        action: "create"
        model: "school_fee_waiver_type"
        save_as: "fwou5_type"
        values:
          name: "FWOU5 Type"
          code: "FWOU5TY"

      - step: "Create the fee waiver reason"
        action: "create"
        model: "school_fee_waiver_reason"
        save_as: "fwou5_reason"
        values:
          name: "FWOU5 Reason"
          code: "FWOU5RS"

      # ``user_id`` is set explicitly to admin (not the restricted user
      # created below) so the exclusion asserted further down is
      # unambiguously caused by the Operating Unit record rule, not by
      # the built-in ownership record rule
      # (``school_fee_waiver_internal_user_rule``, which OR's its own
      # ``user_id = user.id`` domain into the same access check).
      - step: "Create the waiver at School A, owned by admin"
        action: "create"
        model: "school_fee_waiver"
        save_as: "fwou5_waiver_a"
        values:
          type_id: "REC: fwou5_type.id"
          reason_id: "REC: fwou5_reason.id"
          student_id: "REC: fwou5_student_a.id"
          enrollment_id: "REC: fwou5_enrollment_a.id"
          coverage: "multi_term"
          user_id: "REF: base.user_admin"

      - step: "Create the waiver at School B, owned by admin"
        action: "create"
        model: "school_fee_waiver"
        save_as: "fwou5_waiver_b"
        values:
          type_id: "REC: fwou5_type.id"
          reason_id: "REC: fwou5_reason.id"
          student_id: "REC: fwou5_student_b.id"
          enrollment_id: "REC: fwou5_enrollment_b.id"
          coverage: "multi_term"
          user_id: "REF: base.user_admin"

      - step: "Assert the two waivers landed in Operating Units A and B respectively"
        action: "assert"
        target: "fwou5_waiver_a"
        asserts:
          operating_unit_id:
            type: "m2o"
            expected: "REC: fwou5_a"

      - step: "Create a user restricted to Operating Unit A only"
        action: "create"
        model: "res.users"
        save_as: "fwou5_restricted_user"
        values:
          name: "FWOU5 Restricted User"
          login: "fwou5_restricted_user@example.com"
          groups_id:
            - - 6
              - 0
              - - "REF: base.group_user"
                - "REF: ssi_school_fee_waiver.school_fee_waiver_viewer_group"
                - "REF:
                  ssi_school_fee_waiver_operating_unit.school_fee_waiver_operating_unit_group"
          assigned_operating_unit_ids: [[6, 0, ["REC: fwou5_a.id"]]]

      - step:
          "Restricted user searches for the Operating Unit B waiver -- it is excluded"
        action: "search"
        model: "school_fee_waiver"
        domain: [["id", "=", "REC: fwou5_waiver_b.id"]]
        save_as: "fwou5_search_b"
        as_user: "fwou5_restricted_user"
        expect_count: 0

      - step:
          "Restricted user searches for the Operating Unit A waiver -- it is visible"
        action: "search"
        model: "school_fee_waiver"
        domain: [["id", "=", "REC: fwou5_waiver_a.id"]]
        save_as: "fwou5_search_a"
        as_user: "fwou5_restricted_user"
        expect_count: 1

