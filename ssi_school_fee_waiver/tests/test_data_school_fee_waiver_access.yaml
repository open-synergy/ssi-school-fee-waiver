setup:
  steps:
    - step: "Create a user without the Fee Waiver Configurator group"
      action: "create"
      model: "res.users"
      save_as: "outsider"
      values:
        name: "Fee Waiver Outsider"
        login: "fee_waiver_outsider@example.com"
        groups_id: [[6, 0, ["REF: base.group_user"]]]

    - step: "Get the Fee Waiver Type configuration menu"
      action: "ref"
      xml_id: "ssi_school_fee_waiver.school_fee_waiver_type_menu"
      save_as: "type_menu"

    - step: "Get the Fee Waiver Reason configuration menu"
      action: "ref"
      xml_id: "ssi_school_fee_waiver.school_fee_waiver_reason_menu"
      save_as: "reason_menu"

scenarios:
  - name: "Outsider cannot create a Fee Waiver Type"
    steps:
      - step: "Create as outsider must be rejected"
        action: "create"
        model: "school_fee_waiver_type"
        as_user: "outsider"
        expect_error:
          type: "AccessError"
        values:
          name: "Blocked Fee Waiver Type"
          code: "TFWTA01"

  - name: "Outsider cannot create a Fee Waiver Reason"
    steps:
      - step: "Create as outsider must be rejected"
        action: "create"
        model: "school_fee_waiver_reason"
        as_user: "outsider"
        expect_error:
          type: "AccessError"
        values:
          name: "Blocked Fee Waiver Reason"
          code: "TFWRA01"

  - name: "Outsider does not see the Fee Waiver Type configuration menu"
    steps:
      - step: "Search the Fee Waiver Type menu as outsider"
        action: "search"
        model: "ir.ui.menu"
        as_user: "outsider"
        domain: [["id", "=", "REC: type_menu.id"]]
        save_as: "result"
        expect_count: 0

  - name: "Outsider does not see the Fee Waiver Reason configuration menu"
    steps:
      - step: "Search the Fee Waiver Reason menu as outsider"
        action: "search"
        model: "ir.ui.menu"
        as_user: "outsider"
        domain: [["id", "=", "REC: reason_menu.id"]]
        save_as: "result"
        expect_count: 0
