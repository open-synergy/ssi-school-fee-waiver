scenarios:
  - name: "Outsider cannot create a Fee Waiver Type"
    steps:
      - step: "Create a user without the Fee Waiver Type group"
        action: "create"
        model: "res.users"
        save_as: "outsider1"
        values:
          name: "Fee Waiver Outsider 1"
          login: "fee_waiver_outsider1@example.com"
          groups_id: [[6, 0, ["REF: base.group_user"]]]

      - step: "Create as outsider must be rejected"
        action: "create"
        model: "school_fee_waiver_type"
        as_user: "outsider1"
        expect_error:
          type: "AccessError"
        values:
          name: "Blocked Fee Waiver Type"
          code: "TFWTA01"

  - name: "Outsider cannot create a Fee Waiver Reason"
    steps:
      - step: "Create a user without the Fee Waiver Reason group"
        action: "create"
        model: "res.users"
        save_as: "outsider2"
        values:
          name: "Fee Waiver Outsider 2"
          login: "fee_waiver_outsider2@example.com"
          groups_id: [[6, 0, ["REF: base.group_user"]]]

      - step: "Create as outsider must be rejected"
        action: "create"
        model: "school_fee_waiver_reason"
        as_user: "outsider2"
        expect_error:
          type: "AccessError"
        values:
          name: "Blocked Fee Waiver Reason"
          code: "TFWRA01"

  - name: "Outsider does not see the Fee Waiver Type configuration menu"
    steps:
      - step: "Create a user without the Fee Waiver Type group"
        action: "create"
        model: "res.users"
        save_as: "outsider3"
        values:
          name: "Fee Waiver Outsider 3"
          login: "fee_waiver_outsider3@example.com"
          groups_id: [[6, 0, ["REF: base.group_user"]]]

      - step: "Get the Fee Waiver Type configuration menu"
        action: "ref"
        xml_id: "ssi_school_fee_waiver.school_fee_waiver_type_menu"
        save_as: "type_menu"

      - step: "Search the Fee Waiver Type menu as outsider"
        action: "search"
        model: "ir.ui.menu"
        as_user: "outsider3"
        domain: [["id", "=", "REC: type_menu.id"]]
        save_as: "result"
        expect_count: 0

  - name: "Outsider does not see the Fee Waiver Reason configuration menu"
    steps:
      - step: "Create a user without the Fee Waiver Reason group"
        action: "create"
        model: "res.users"
        save_as: "outsider4"
        values:
          name: "Fee Waiver Outsider 4"
          login: "fee_waiver_outsider4@example.com"
          groups_id: [[6, 0, ["REF: base.group_user"]]]

      - step: "Get the Fee Waiver Reason configuration menu"
        action: "ref"
        xml_id: "ssi_school_fee_waiver.school_fee_waiver_reason_menu"
        save_as: "reason_menu"

      - step: "Search the Fee Waiver Reason menu as outsider"
        action: "search"
        model: "ir.ui.menu"
        as_user: "outsider4"
        domain: [["id", "=", "REC: reason_menu.id"]]
        save_as: "result"
        expect_count: 0

  - name: "Fee Waiver Type group is separate from Fee Waiver Reason group"
    steps:
      - step: "Create a user in only the Fee Waiver Type group"
        action: "create"
        model: "res.users"
        save_as: "type_only_user"
        values:
          name: "Fee Waiver Type Only User"
          login: "fee_waiver_type_only@example.com"
          groups_id:
            [
              [
                6,
                0,
                [
                  "REF: base.group_user",
                  "REF: ssi_school_fee_waiver.school_fee_waiver_type_group",
                ],
              ],
            ]

      - step: "Create as the Fee Waiver Type group member must succeed"
        action: "create"
        model: "school_fee_waiver_type"
        as_user: "type_only_user"
        save_as: "type_only_type"
        values:
          name: "Type-Only Group Fee Waiver Type"
          code: "TFWTA02"

      - step: "Create Fee Waiver Reason as the same user must be rejected"
        action: "create"
        model: "school_fee_waiver_reason"
        as_user: "type_only_user"
        expect_error:
          type: "AccessError"
        values:
          name: "Blocked Fee Waiver Reason For Type-Only User"
          code: "TFWRA02"
