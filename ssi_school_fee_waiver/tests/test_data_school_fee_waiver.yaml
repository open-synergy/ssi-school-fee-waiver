options:
  auto_refresh: true
scenarios:
  - name: "Fee Waiver - Create, Compute, Workflow, Cancel, And Constraints"
    steps:
      # ── Shared fixture chain (suffix FW1) ────────────────────────
      - step: "Create the grade type"
        action: "create"
        model: "school_grade_type"
        save_as: "fw1_grade_type"
        values:
          name: "FW1 Grade Type"
          code: "FW1GT"

      - step: "Create the school"
        action: "create"
        model: "school"
        save_as: "fw1_school"
        values:
          name: "FW1 School"
          code: "FW1SC"
          grade_type_id: "REC: fw1_grade_type.id"

      - step: "Create the academic year"
        action: "create"
        model: "school_academic_year"
        save_as: "fw1_academic_year"
        values:
          name: "FW1 Academic Year"
          code: "FW1AY"
          date_start: 2026-07-01
          date_end: 2027-06-30

      - step: "Create the academic term"
        action: "create"
        model: "school_academic_term"
        save_as: "fw1_academic_term"
        values:
          name: "FW1 Term"
          code: "FW1TM"
          date_start: 2026-07-01
          date_end: 2026-12-31
          year_id: "REC: fw1_academic_year.id"

      - step: "Create the grade"
        action: "create"
        model: "school_grade"
        save_as: "fw1_grade"
        values:
          name: "FW1 Grade"
          code: "FW1GR"
          type_id: "REC: fw1_grade_type.id"

      - step: "Create the grade class"
        action: "create"
        model: "school_grade_class"
        save_as: "fw1_grade_class"
        values:
          name: "FW1 Class"
          code: "FW1CL"
          school_id: "REC: fw1_school.id"
          grade_id: "REC: fw1_grade.id"

      - step: "Create the student contact"
        action: "create"
        model: "res.partner"
        save_as: "fw1_contact"
        values:
          name: "FW1 Contact"

      - step: "Create the student"
        action: "create"
        model: "school_student"
        save_as: "fw1_student"
        values:
          name: "FW1 Student"
          code: "FW1ST"
          contact_id: "REC: fw1_contact.id"
          school_id: "REC: fw1_school.id"

      - step: "Create the enrollment"
        action: "create"
        model: "school_enrollment"
        save_as: "fw1_enrollment"
        values:
          academic_year_id: "REC: fw1_academic_year.id"
          academic_term_id: "REC: fw1_academic_term.id"
          school_id: "REC: fw1_school.id"
          grade_id: "REC: fw1_grade.id"
          grade_class_id: "REC: fw1_grade_class.id"
          student_id: "REC: fw1_student.id"

      - step: "Get the account.account.type Income reference"
        action: "ref"
        xml_id: "account.data_account_type_revenue"
        save_as: "account_type_income"

      - step: "Create the income account used by payment term details"
        action: "create"
        model: "account.account"
        save_as: "fw1_income_account"
        values:
          name: "FW1 Income Account"
          code: "FW1IA"
          user_type_id: "REC: account_type_income.id"
          reconcile: false

      - step: "Create the product covered by the waiver line"
        action: "create"
        model: "product.product"
        save_as: "fw1_product"
        values:
          name: "FW1 Product"
          type: "service"

      - step: "Create Payment Term 1"
        action: "create"
        model: "school_enrollment_payment_term"
        save_as: "fw1_term1"
        values:
          enrollment_id: "REC: fw1_enrollment.id"
          name: "FW1 Term 1"
          date_due: 2026-08-15
          detail_ids:
            - - 0
              - 0
              - product_id: "REC: fw1_product.id"
                name: "FW1 Term 1 Fee"
                account_id: "REC: fw1_income_account.id"
                uom_quantity: 1.0
                uom_id: "REF: uom.product_uom_unit"
                price_unit: 1000000.0

      - step: "Create Payment Term 2 (for the cancel scenario)"
        action: "create"
        model: "school_enrollment_payment_term"
        save_as: "fw1_term2"
        values:
          enrollment_id: "REC: fw1_enrollment.id"
          name: "FW1 Term 2"
          date_due: 2026-09-15
          detail_ids:
            - - 0
              - 0
              - product_id: "REC: fw1_product.id"
                name: "FW1 Term 2 Fee"
                account_id: "REC: fw1_income_account.id"
                uom_quantity: 1.0
                uom_id: "REF: uom.product_uom_unit"
                price_unit: 1000000.0

      - step: "Create the fee waiver type"
        action: "create"
        model: "school_fee_waiver_type"
        save_as: "fw1_type"
        values:
          name: "FW1 Type"
          code: "FW1TY"

      - step: "Create the fee waiver reason"
        action: "create"
        model: "school_fee_waiver_reason"
        save_as: "fw1_reason"
        values:
          name: "FW1 Reason"
          code: "FW1RS"

      # ── Positive: create, compute derived fields ─────────────────
      - step: "Create the fee waiver document"
        action: "create"
        model: "school_fee_waiver"
        save_as: "fw1_waiver"
        values:
          type_id: "REC: fw1_type.id"
          reason_id: "REC: fw1_reason.id"
          student_id: "REC: fw1_student.id"
          enrollment_id: "REC: fw1_enrollment.id"
          coverage: "single_term"
          payment_term_id: "REC: fw1_term1.id"
          user_id: "REF: base.user_admin"
          line_ids:
            - - 0
              - 0
              - product_id: "REC: fw1_product.id"
                computation: "percentage"
                percentage: 50.0

      - step: "Assert Billing Source defaults and derived fields"
        action: "assert"
        target: "fw1_waiver"
        asserts:
          source_type:
            type: "value"
            expected: "enrollment"
          partner_id:
            type: "m2o"
            expected: "REC: fw1_contact"
          school_id:
            type: "m2o"
            expected: "REC: fw1_school"
          grade_id:
            type: "m2o"
            expected: "REC: fw1_grade"
          academic_year_id:
            type: "m2o"
            expected: "REC: fw1_academic_year"
          state:
            type: "value"
            expected: "draft"

      # ── Positive: full workflow to Done ───────────────────────────
      - step: "Confirm the fee waiver"
        action: "call"
        target: "fw1_waiver"
        method: "action_confirm"
        as_user: "base.user_admin"
        asserts:
          state:
            type: "value"
            expected: "confirm"

      - step: "Approve the fee waiver"
        action: "call"
        target: "fw1_waiver"
        method: "action_approve_approval"
        as_user: "base.user_admin"
        asserts:
          state:
            type: "value"
            expected: "open"
          name:
            type: "value"
            operator: "is_truthy"

      - step: "Schedule was auto-generated on Open"
        action: "assert"
        target: "fw1_waiver"
        asserts:
          schedule_ids:
            type: "o2m"
            check: "count"
            expected_count: 1

      - step: "Finish the fee waiver"
        action: "call"
        target: "fw1_waiver"
        method: "action_done"
        as_user: "base.user_admin"
        asserts:
          state:
            type: "value"
            expected: "done"

      # ── Positive: cancel via the cancel-reason wizard ─────────────
      - step: "Create a second fee waiver to cancel"
        action: "create"
        model: "school_fee_waiver"
        save_as: "fw1_waiver_cancel"
        values:
          type_id: "REC: fw1_type.id"
          reason_id: "REC: fw1_reason.id"
          student_id: "REC: fw1_student.id"
          enrollment_id: "REC: fw1_enrollment.id"
          coverage: "single_term"
          payment_term_id: "REC: fw1_term2.id"
          user_id: "REF: base.user_admin"
          line_ids:
            - - 0
              - 0
              - product_id: "REC: fw1_product.id"
                computation: "full"

      - step: "Confirm the second fee waiver"
        action: "call"
        target: "fw1_waiver_cancel"
        method: "action_confirm"
        as_user: "base.user_admin"
        asserts:
          state:
            type: "value"
            expected: "confirm"

      - step: "Create the cancellation reason"
        action: "create"
        model: "base.cancel_reason"
        save_as: "fw1_cancel_reason"
        values:
          name: "FW1 Cancel Reason"
          code: "FW1CR"

      - step: "Cancel the second fee waiver via the wizard"
        action: "wizard"
        model: "base.select_cancel_reason"
        target: "fw1_waiver_cancel"
        as_user: "base.user_admin"
        values:
          cancel_reason_id: "REC: fw1_cancel_reason.id"
        method: "action_confirm"
        asserts:
          state:
            type: "value"
            expected: "cancel"

      # ── Negative: required header fields ──────────────────────────
      - step: "Create without Type must be rejected"
        action: "create"
        model: "school_fee_waiver"
        expect_error:
          type: "ValidationError"
        values:
          reason_id: "REC: fw1_reason.id"
          student_id: "REC: fw1_student.id"
          enrollment_id: "REC: fw1_enrollment.id"
          coverage: "single_term"
          payment_term_id: "REC: fw1_term1.id"

      - step: "Create without Reason must be rejected"
        action: "create"
        model: "school_fee_waiver"
        expect_error:
          type: "ValidationError"
        values:
          type_id: "REC: fw1_type.id"
          student_id: "REC: fw1_student.id"
          enrollment_id: "REC: fw1_enrollment.id"
          coverage: "single_term"
          payment_term_id: "REC: fw1_term1.id"

      - step: "Create without Student must be rejected"
        action: "create"
        model: "school_fee_waiver"
        expect_error:
          type: "ValidationError"
        values:
          type_id: "REC: fw1_type.id"
          reason_id: "REC: fw1_reason.id"
          enrollment_id: "REC: fw1_enrollment.id"
          coverage: "single_term"
          payment_term_id: "REC: fw1_term1.id"

      # ── Negative: billing source constraint ───────────────────────
      - step: "Enrollment source without Enrollment must be rejected"
        action: "create"
        model: "school_fee_waiver"
        expect_error:
          type: "ValidationError"
        values:
          type_id: "REC: fw1_type.id"
          reason_id: "REC: fw1_reason.id"
          student_id: "REC: fw1_student.id"
          source_type: "enrollment"
          coverage: "single_term"

      # ── Negative: coverage / payment term constraint ──────────────
      - step: "Single Payment Term without a Payment Term must be rejected"
        action: "create"
        model: "school_fee_waiver"
        expect_error:
          type: "ValidationError"
        values:
          type_id: "REC: fw1_type.id"
          reason_id: "REC: fw1_reason.id"
          student_id: "REC: fw1_student.id"
          enrollment_id: "REC: fw1_enrollment.id"
          coverage: "single_term"

      - step: "Multiple Payment Terms with a Payment Term must be rejected"
        action: "create"
        model: "school_fee_waiver"
        expect_error:
          type: "ValidationError"
        values:
          type_id: "REC: fw1_type.id"
          reason_id: "REC: fw1_reason.id"
          student_id: "REC: fw1_student.id"
          enrollment_id: "REC: fw1_enrollment.id"
          coverage: "multi_term"
          payment_term_id: "REC: fw1_term1.id"

      # ── Negative: waiver line constraints ──────────────────────────
      - step: "Draft waiver for line constraint checks"
        action: "create"
        model: "school_fee_waiver"
        save_as: "fw1_waiver_line_check"
        values:
          type_id: "REC: fw1_type.id"
          reason_id: "REC: fw1_reason.id"
          student_id: "REC: fw1_student.id"
          enrollment_id: "REC: fw1_enrollment.id"
          coverage: "single_term"
          payment_term_id: "REC: fw1_term1.id"

      - step: "Line with both Product and Product Category must be rejected"
        action: "create"
        model: "school_fee_waiver_line"
        expect_error:
          type: "ValidationError"
        values:
          waiver_id: "REC: fw1_waiver_line_check.id"
          product_id: "REC: fw1_product.id"
          product_category_id: "REF: product.product_category_all"
          computation: "full"

      - step: "Line with neither Product nor Product Category must be rejected"
        action: "create"
        model: "school_fee_waiver_line"
        expect_error:
          type: "ValidationError"
        values:
          waiver_id: "REC: fw1_waiver_line_check.id"
          computation: "full"

      - step: "Percentage line with Percentage over 100 must be rejected"
        action: "create"
        model: "school_fee_waiver_line"
        expect_error:
          type: "ValidationError"
        values:
          waiver_id: "REC: fw1_waiver_line_check.id"
          product_id: "REC: fw1_product.id"
          computation: "percentage"
          percentage: 150.0

      - step: "Percentage line with Percentage of zero must be rejected"
        action: "create"
        model: "school_fee_waiver_line"
        expect_error:
          type: "ValidationError"
        values:
          waiver_id: "REC: fw1_waiver_line_check.id"
          product_id: "REC: fw1_product.id"
          computation: "percentage"
          percentage: 0.0

      - step: "Fixed line with Fixed Amount of zero must be rejected"
        action: "create"
        model: "school_fee_waiver_line"
        expect_error:
          type: "ValidationError"
        values:
          waiver_id: "REC: fw1_waiver_line_check.id"
          product_id: "REC: fw1_product.id"
          computation: "fixed"
          amount_fixed: 0.0

      # ── Negative: approval policy ──────────────────────────────────
      - step: "Create a plain internal user with no approver group"
        action: "create"
        model: "res.users"
        save_as: "fw1_plain_user"
        values:
          name: "FW1 Plain User"
          login: "fw1_plain_user@example.com"
          groups_id: [[6, 0, ["REF: base.group_user"]]]

      - step: "Create a third fee waiver to test rejection"
        action: "create"
        model: "school_fee_waiver"
        save_as: "fw1_waiver_reject"
        values:
          type_id: "REC: fw1_type.id"
          reason_id: "REC: fw1_reason.id"
          student_id: "REC: fw1_student.id"
          enrollment_id: "REC: fw1_enrollment.id"
          coverage: "single_term"
          payment_term_id: "REC: fw1_term1.id"
          user_id: "REF: base.user_admin"
          line_ids:
            - - 0
              - 0
              - product_id: "REC: fw1_product.id"
                computation: "full"

      - step: "Confirm the third fee waiver"
        action: "call"
        target: "fw1_waiver_reject"
        method: "action_confirm"
        as_user: "base.user_admin"
        asserts:
          state:
            type: "value"
            expected: "confirm"

      - step: "Approve as a user with no approver group must be rejected"
        action: "call"
        target: "fw1_waiver_reject"
        method: "action_approve_approval"
        as_user: "fw1_plain_user"
        expect_error:
          type: "UserError"
