#
# T-01 (odoo-development-unit-test/test-traps.md): scenarios in one YAML file
# share one un-rolled-back DB transaction and a `setup:` block replays before
# every scenario, so this file uses exactly ONE scenario, no `setup:` block.
# Fixture codes use the `MB*`/`mb_*` prefix, deliberately different from the
# other test files of this module, to avoid unique-constraint collisions.
options:
  auto_refresh: true
scenarios:
  - name: "Deduction - Allocation amounts per invoice and Journal type"
    steps:
      # ── Shared fixtures (school hierarchy, accounts, journals, product,
      # invoice type) plus one waiver with two 1,000,000 payment terms. ──
      - step: "Create the grade type"
        action: "create"
        model: "school_grade_type"
        save_as: "mb_grade_type"
        values:
          name: "MB Grade Type"
          code: "MBGT"

      - step: "Create the school"
        action: "create"
        model: "school"
        save_as: "mb_school"
        values:
          name: "MB School"
          code: "MBSC"
          grade_type_id: "REC: mb_grade_type.id"

      - step: "Create the academic year"
        action: "create"
        model: "school_academic_year"
        save_as: "mb_academic_year"
        values:
          name: "MB Academic Year"
          code: "MBAY"
          date_start: 2026-07-01
          date_end: 2027-06-30

      - step: "Create the academic term"
        action: "create"
        model: "school_academic_term"
        save_as: "mb_academic_term"
        values:
          name: "MB Term"
          code: "MBTM"
          date_start: 2026-07-01
          date_end: 2026-12-31
          year_id: "REC: mb_academic_year.id"

      - step: "Create the grade"
        action: "create"
        model: "school_grade"
        save_as: "mb_grade"
        values:
          name: "MB Grade"
          code: "MBGR"
          type_id: "REC: mb_grade_type.id"

      - step: "Create the grade class"
        action: "create"
        model: "school_grade_class"
        save_as: "mb_grade_class"
        values:
          name: "MB Class"
          code: "MBCL"
          school_id: "REC: mb_school.id"
          grade_id: "REC: mb_grade.id"

      - step: "Get the account.account.type Receivable reference"
        action: "ref"
        xml_id: "account.data_account_type_receivable"
        save_as: "mb_receivable_acc_type"

      - step: "Get the account.account.type Income reference"
        action: "ref"
        xml_id: "account.data_account_type_revenue"
        save_as: "mb_income_acc_type"

      - step: "Get the account.account.type Expense reference"
        action: "ref"
        xml_id: "account.data_account_type_expenses"
        save_as: "mb_expense_acc_type"

      - step: "Get the account.account.type Liquidity reference"
        action: "ref"
        xml_id: "account.data_account_type_liquidity"
        save_as: "mb_liquidity_acc_type"

      - step: "Create the shared Receivable Account"
        action: "create"
        model: "account.account"
        save_as: "mb_receivable_account"
        values:
          name: "MB Receivable Account"
          code: "MBRA"
          user_type_id: "REC: mb_receivable_acc_type.id"
          reconcile: true

      - step: "Create the income account used by terms and invoices"
        action: "create"
        model: "account.account"
        save_as: "mb_income_account"
        values:
          name: "MB Income Account"
          code: "MBIA"
          user_type_id: "REC: mb_income_acc_type.id"
          reconcile: false

      - step: "Create the discount (contra-revenue) account"
        action: "create"
        model: "account.account"
        save_as: "mb_discount_account"
        values:
          name: "MB Discount Account"
          code: "MBDA"
          user_type_id: "REC: mb_expense_acc_type.id"
          reconcile: false

      - step: "Create the liquidity account used by the customer payment"
        action: "create"
        model: "account.account"
        save_as: "mb_liquidity_account"
        values:
          name: "MB Liquidity Account"
          code: "MBLQ"
          user_type_id: "REC: mb_liquidity_acc_type.id"
          reconcile: false

      - step: "Create the deduction journal"
        action: "create"
        model: "account.journal"
        save_as: "mb_deduction_journal"
        values:
          name: "MB Deduction Journal"
          code: "MBDJ"
          type: "general"

      - step: "Create the sale journal (customer invoices)"
        action: "create"
        model: "account.journal"
        save_as: "mb_sale_journal"
        values:
          name: "MB Sale Journal"
          code: "MBSJ"
          type: "sale"

      - step: "Create the general journal used by the customer payment"
        action: "create"
        model: "account.journal"
        save_as: "mb_payment_journal"
        values:
          name: "MB Payment Journal"
          code: "MBPJ"
          type: "general"

      - step: "Create the product covered by the waiver lines"
        action: "create"
        model: "product.product"
        save_as: "mb_product"
        values:
          name: "MB Product"
          type: "service"

      - step: "Create the fee waiver type, with deduction accounting defaults"
        action: "create"
        model: "school_fee_waiver_type"
        save_as: "mb_type"
        values:
          name: "MB Type"
          code: "MBTY"
          deduction_journal_id: "REC: mb_deduction_journal.id"
          discount_account_id: "REC: mb_discount_account.id"

      - step: "Create the fee waiver reason"
        action: "create"
        model: "school_fee_waiver_reason"
        save_as: "mb_reason"
        values:
          name: "MB Reason"
          code: "MBRS"

      - step: "Create the customer invoice type"
        action: "create"
        model: "customer_invoice_type"
        save_as: "mb_invoice_type"
        values:
          name: "MB Invoice Type"
          code: "/"
          journal_id: "REC: mb_sale_journal.id"
          receivable_account_id: "REC: mb_receivable_account.id"

      # ══ MB -- one waiver whose Schedules are deducted by four deductions.
      # Each deduction has Line A 200,000 (Invoice A) and Line B 100,000
      # (Invoice B); only the Allocations (or Journal) differ. ═══════════
      - step: "MB: create the student contact"
        action: "create"
        model: "res.partner"
        save_as: "mb_contact"
        values:
          name: "MB Contact"

      - step: "MB: create the student"
        action: "create"
        model: "school_student"
        save_as: "mb_student"
        values:
          name: "MB Student"
          code: "MBST"
          contact_id: "REC: mb_contact.id"
          school_id: "REC: mb_school.id"

      - step: "MB: create the enrollment"
        action: "create"
        model: "school_enrollment"
        save_as: "mb_enrollment"
        values:
          academic_year_id: "REC: mb_academic_year.id"
          academic_term_id: "REC: mb_academic_term.id"
          school_id: "REC: mb_school.id"
          grade_id: "REC: mb_grade.id"
          grade_class_id: "REC: mb_grade_class.id"
          student_id: "REC: mb_student.id"

      - step: "MB: create Payment Term 1 (1,000,000)"
        action: "create"
        model: "school_enrollment_payment_term"
        save_as: "mb_term1"
        values:
          enrollment_id: "REC: mb_enrollment.id"
          name: "MB Term 1"
          date_due: 2026-08-15
          detail_ids:
            - - 0
              - 0
              - product_id: "REC: mb_product.id"
                name: "MB Term 1 Fee"
                account_id: "REC: mb_income_account.id"
                uom_quantity: 1.0
                uom_id: "REF: uom.product_uom_unit"
                price_unit: 1000000.0

      - step: "MB: create Payment Term 2 (1,000,000)"
        action: "create"
        model: "school_enrollment_payment_term"
        save_as: "mb_term2"
        values:
          enrollment_id: "REC: mb_enrollment.id"
          name: "MB Term 2"
          date_due: 2026-09-15
          detail_ids:
            - - 0
              - 0
              - product_id: "REC: mb_product.id"
                name: "MB Term 2 Fee"
                account_id: "REC: mb_income_account.id"
                uom_quantity: 1.0
                uom_id: "REF: uom.product_uom_unit"
                price_unit: 1000000.0

      - step: "MB: create the fee waiver document (Multiple Payment Terms)"
        action: "create"
        model: "school_fee_waiver"
        save_as: "mb_waiver"
        values:
          type_id: "REC: mb_type.id"
          reason_id: "REC: mb_reason.id"
          student_id: "REC: mb_student.id"
          enrollment_id: "REC: mb_enrollment.id"
          coverage: "multi_term"
          date_start: 2026-07-01
          date_end: 2026-12-31
          user_id: "REF: base.user_admin"
          line_ids:
            - - 0
              - 0
              - product_id: "REC: mb_product.id"
                computation: "full"

      - step: "MB: confirm the fee waiver"
        action: "call"
        target: "mb_waiver"
        method: "action_confirm"
        as_user: "base.user_admin"
        asserts:
          state:
            type: "value"
            expected: "confirm"

      - step: "MB: approve the fee waiver"
        action: "call"
        target: "mb_waiver"
        method: "action_approve_approval"
        as_user: "base.user_admin"
        asserts:
          state:
            type: "value"
            expected: "open"

      - step: "MB: find the Term 1 Schedule line"
        action: "search"
        model: "school_fee_waiver_schedule"
        domain:
          [
            ["waiver_id", "=", "REC: mb_waiver.id"],
            ["payment_term_id", "=", "REC: mb_term1.id"],
          ]
        save_as: "mb_sched1"
        limit: 1

      - step: "MB: find the Term 2 Schedule line"
        action: "search"
        model: "school_fee_waiver_schedule"
        domain:
          [
            ["waiver_id", "=", "REC: mb_waiver.id"],
            ["payment_term_id", "=", "REC: mb_term2.id"],
          ]
        save_as: "mb_sched2"
        limit: 1

      - step: "MB: set the enrollment's invoicing defaults"
        action: "write"
        target: "mb_enrollment"
        values:
          receivable_journal_id: "REC: mb_sale_journal.id"
          receivable_account_id: "REC: mb_receivable_account.id"
          customer_invoice_type_id: "REC: mb_invoice_type.id"

      - step: "MB Invoice A: create the invoice from its own payment term"
        action: "call"
        target: "mb_term1"
        method: "action_create_invoice"
        as_user: "base.user_admin"

      - step: "MB Invoice A: get the term's generated invoice"
        action: "search"
        model: "customer_invoice"
        domain: [["id", "=", "REC: mb_term1.customer_invoice_id.id"]]
        save_as: "mb_invoice_a"
        expect_count: 1

      - step: "MB: confirm Invoice A"
        action: "call"
        target: "mb_invoice_a"
        method: "action_confirm"
        as_user: "base.user_admin"
        asserts:
          state:
            type: "value"
            expected: "confirm"

      - step: "MB: approve Invoice A"
        action: "call"
        target: "mb_invoice_a"
        method: "action_approve_approval"
        as_user: "base.user_admin"
        asserts:
          state:
            type: "value"
            expected: "open"
          amount_residual:
            type: "value"
            expected: 1000000.0

      - step: "MB Invoice B: create the invoice from its own payment term"
        action: "call"
        target: "mb_term2"
        method: "action_create_invoice"
        as_user: "base.user_admin"

      - step: "MB Invoice B: get the term's generated invoice"
        action: "search"
        model: "customer_invoice"
        domain: [["id", "=", "REC: mb_term2.customer_invoice_id.id"]]
        save_as: "mb_invoice_b"
        expect_count: 1

      - step: "MB: confirm Invoice B"
        action: "call"
        target: "mb_invoice_b"
        method: "action_confirm"
        as_user: "base.user_admin"
        asserts:
          state:
            type: "value"
            expected: "confirm"

      - step: "MB: approve Invoice B"
        action: "call"
        target: "mb_invoice_b"
        method: "action_approve_approval"
        as_user: "base.user_admin"
        asserts:
          state:
            type: "value"
            expected: "open"
          amount_residual:
            type: "value"
            expected: 1000000.0

      - step: "MB1: create the fee waiver deduction document"
        action: "create"
        model: "school_fee_waiver_deduction"
        save_as: "mb1_deduction"
        values:
          waiver_id: "REC: mb_waiver.id"
          journal_id: "REC: mb_deduction_journal.id"
          receivable_account_id: "REC: mb_receivable_account.id"
          date: 2026-08-25

      - step: "MB1: add Line A (Term 1 Schedule, 200,000)"
        action: "create"
        model: "school_fee_waiver_deduction_line"
        save_as: "mb1_line_a"
        values:
          deduction_id: "REC: mb1_deduction.id"
          schedule_id: "REC: mb_sched1.id"
          account_id: "REC: mb_discount_account.id"
          amount: 200000.0

      - step: "MB1: add Line B (Term 2 Schedule, 100,000)"
        action: "create"
        model: "school_fee_waiver_deduction_line"
        save_as: "mb1_line_b"
        values:
          deduction_id: "REC: mb1_deduction.id"
          schedule_id: "REC: mb_sched2.id"
          account_id: "REC: mb_discount_account.id"
          amount: 100000.0

      - step: "MB1: add Allocation 1 (Invoice A, 100,000)"
        action: "create"
        model: "school_fee_waiver_deduction_allocation"
        save_as: "mb1_alloc1"
        values:
          deduction_id: "REC: mb1_deduction.id"
          customer_invoice_id: "REC: mb_invoice_a.id"
          amount: 100000.0

      - step: "MB1: add Allocation 2 (Invoice B, 200,000)"
        action: "create"
        model: "school_fee_waiver_deduction_allocation"
        save_as: "mb1_alloc2"
        values:
          deduction_id: "REC: mb1_deduction.id"
          customer_invoice_id: "REC: mb_invoice_b.id"
          amount: 200000.0

      - step: "MB1: confirm the deduction document"
        action: "call"
        target: "mb1_deduction"
        method: "action_confirm"
        as_user: "base.user_admin"
        asserts:
          state:
            type: "value"
            expected: "confirm"

      - step: "MB1: force a refresh before reading approve_ok (T-04)"
        action: "assert"
        target: "mb1_deduction"
        asserts:
          state:
            type: "value"
            expected: "confirm"

      - step: "MB1: approving is rejected -- swapped Allocations, same total"
        action: "call"
        target: "mb1_deduction"
        method: "action_approve_approval"
        as_user: "base.user_admin"
        expect_error:
          type: "UserError"
          message_contains: "instead of expected 200000.0"

      - step: "MB1: the deduction document stayed in Confirm"
        action: "assert"
        target: "mb1_deduction"
        asserts:
          state:
            type: "value"
            expected: "confirm"
          move_id:
            type: "value"
            operator: "is_falsy"

      - step: "MB2: create the fee waiver deduction document"
        action: "create"
        model: "school_fee_waiver_deduction"
        save_as: "mb2_deduction"
        values:
          waiver_id: "REC: mb_waiver.id"
          journal_id: "REC: mb_deduction_journal.id"
          receivable_account_id: "REC: mb_receivable_account.id"
          date: 2026-08-25

      - step: "MB2: add Line A (Term 1 Schedule, 200,000)"
        action: "create"
        model: "school_fee_waiver_deduction_line"
        save_as: "mb2_line_a"
        values:
          deduction_id: "REC: mb2_deduction.id"
          schedule_id: "REC: mb_sched1.id"
          account_id: "REC: mb_discount_account.id"
          amount: 200000.0

      - step: "MB2: add Line B (Term 2 Schedule, 100,000)"
        action: "create"
        model: "school_fee_waiver_deduction_line"
        save_as: "mb2_line_b"
        values:
          deduction_id: "REC: mb2_deduction.id"
          schedule_id: "REC: mb_sched2.id"
          account_id: "REC: mb_discount_account.id"
          amount: 100000.0

      - step: "MB2: add Allocation 1 (Invoice B, 300,000)"
        action: "create"
        model: "school_fee_waiver_deduction_allocation"
        save_as: "mb2_alloc1"
        values:
          deduction_id: "REC: mb2_deduction.id"
          customer_invoice_id: "REC: mb_invoice_b.id"
          amount: 300000.0

      - step: "MB2: confirm the deduction document"
        action: "call"
        target: "mb2_deduction"
        method: "action_confirm"
        as_user: "base.user_admin"
        asserts:
          state:
            type: "value"
            expected: "confirm"

      - step: "MB2: force a refresh before reading approve_ok (T-04)"
        action: "assert"
        target: "mb2_deduction"
        asserts:
          state:
            type: "value"
            expected: "confirm"

      - step: "MB2: approving is rejected -- Invoice A has no Allocation"
        action: "call"
        target: "mb2_deduction"
        method: "action_approve_approval"
        as_user: "base.user_admin"
        expect_error:
          type: "UserError"
          message_contains: "has no Allocation"

      - step: "MB2: the deduction document stayed in Confirm"
        action: "assert"
        target: "mb2_deduction"
        asserts:
          state:
            type: "value"
            expected: "confirm"
          move_id:
            type: "value"
            operator: "is_falsy"

      - step: "MB3: create a bank journal"
        action: "create"
        model: "account.journal"
        save_as: "mb_bank_journal"
        values:
          name: "MB Bank Journal"
          code: "MBBK"
          type: "bank"

      - step: "MB3: create the fee waiver deduction document"
        action: "create"
        model: "school_fee_waiver_deduction"
        save_as: "mb3_deduction"
        values:
          waiver_id: "REC: mb_waiver.id"
          journal_id: "REC: mb_bank_journal.id"
          receivable_account_id: "REC: mb_receivable_account.id"
          date: 2026-08-25

      - step: "MB3: add Line A (Term 1 Schedule, 200,000)"
        action: "create"
        model: "school_fee_waiver_deduction_line"
        save_as: "mb3_line_a"
        values:
          deduction_id: "REC: mb3_deduction.id"
          schedule_id: "REC: mb_sched1.id"
          account_id: "REC: mb_discount_account.id"
          amount: 200000.0

      - step: "MB3: add Line B (Term 2 Schedule, 100,000)"
        action: "create"
        model: "school_fee_waiver_deduction_line"
        save_as: "mb3_line_b"
        values:
          deduction_id: "REC: mb3_deduction.id"
          schedule_id: "REC: mb_sched2.id"
          account_id: "REC: mb_discount_account.id"
          amount: 100000.0

      - step: "MB3: add Allocation 1 (Invoice A, 200,000)"
        action: "create"
        model: "school_fee_waiver_deduction_allocation"
        save_as: "mb3_alloc1"
        values:
          deduction_id: "REC: mb3_deduction.id"
          customer_invoice_id: "REC: mb_invoice_a.id"
          amount: 200000.0

      - step: "MB3: add Allocation 2 (Invoice B, 100,000)"
        action: "create"
        model: "school_fee_waiver_deduction_allocation"
        save_as: "mb3_alloc2"
        values:
          deduction_id: "REC: mb3_deduction.id"
          customer_invoice_id: "REC: mb_invoice_b.id"
          amount: 100000.0

      - step: "MB3: confirming is rejected -- the Journal is of type bank"
        action: "call"
        target: "mb3_deduction"
        method: "action_confirm"
        as_user: "base.user_admin"
        expect_error:
          type: "UserError"
          message_contains: "has type 'bank'"

      - step: "MB3: the deduction document stayed in Draft"
        action: "assert"
        target: "mb3_deduction"
        asserts:
          state:
            type: "value"
            expected: "draft"

      - step: "MB4: create the fee waiver deduction document"
        action: "create"
        model: "school_fee_waiver_deduction"
        save_as: "mb4_deduction"
        values:
          waiver_id: "REC: mb_waiver.id"
          journal_id: "REC: mb_deduction_journal.id"
          receivable_account_id: "REC: mb_receivable_account.id"
          date: 2026-08-25

      - step: "MB4: add Line A (Term 1 Schedule, 200,000)"
        action: "create"
        model: "school_fee_waiver_deduction_line"
        save_as: "mb4_line_a"
        values:
          deduction_id: "REC: mb4_deduction.id"
          schedule_id: "REC: mb_sched1.id"
          account_id: "REC: mb_discount_account.id"
          amount: 200000.0

      - step: "MB4: add Line B (Term 2 Schedule, 100,000)"
        action: "create"
        model: "school_fee_waiver_deduction_line"
        save_as: "mb4_line_b"
        values:
          deduction_id: "REC: mb4_deduction.id"
          schedule_id: "REC: mb_sched2.id"
          account_id: "REC: mb_discount_account.id"
          amount: 100000.0

      - step: "MB4: add Allocation 1 (Invoice A, 200,000)"
        action: "create"
        model: "school_fee_waiver_deduction_allocation"
        save_as: "mb4_alloc1"
        values:
          deduction_id: "REC: mb4_deduction.id"
          customer_invoice_id: "REC: mb_invoice_a.id"
          amount: 200000.0

      - step: "MB4: add Allocation 2 (Invoice B, 100,000)"
        action: "create"
        model: "school_fee_waiver_deduction_allocation"
        save_as: "mb4_alloc2"
        values:
          deduction_id: "REC: mb4_deduction.id"
          customer_invoice_id: "REC: mb_invoice_b.id"
          amount: 100000.0

      - step: "MB4: confirm the deduction document"
        action: "call"
        target: "mb4_deduction"
        method: "action_confirm"
        as_user: "base.user_admin"
        asserts:
          state:
            type: "value"
            expected: "confirm"

      - step: "MB4: force a refresh before reading approve_ok (T-04)"
        action: "assert"
        target: "mb4_deduction"
        asserts:
          state:
            type: "value"
            expected: "confirm"

      - step:
          "MB4: approve the deduction document -- auto-completes (Done) (single level)"
        action: "call"
        target: "mb4_deduction"
        method: "action_approve_approval"
        as_user: "base.user_admin"
        asserts:
          state:
            type: "value"
            expected: "done"

      - step: "MB4: Invoice A's residual dropped by exactly 200,000"
        action: "assert"
        target: "mb_invoice_a"
        asserts:
          amount_residual:
            type: "value"
            expected: 800000.0

      - step: "MB4: Invoice B's residual dropped by exactly 100,000"
        action: "assert"
        target: "mb_invoice_b"
        asserts:
          amount_residual:
            type: "value"
            expected: 900000.0
